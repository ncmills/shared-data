# rubrics/bestman.yaml — CORPUS-M5 fit rubric for Best Man HQ (scorer input), v1.1 (R1 FIX round 1).
# Every cap, rule and criterion cites the line of profiles/bestman.yaml it is written from, with a quote that
# must appear on that line (checked by scripts/corpus/verify-suitability.ts). Nothing here
# overrides a hard exclude: a row the rules mark "no" is never scored.
# The rubric version stamped on every score is rubric-bestman@<version>+<git blob sha of this file>.
#
# v1.1 scores what the venue IS, not how its row is written (R1 F2):
#   - the scorer view replaces occasion words in the row's copy with "[occasion]" (the name is kept);
#   - the other-occasion pitch is a deterministic flag (`occasion`), never a model judgement;
#   - group size is computed from the row's fields (`rules`), not judged;
#   - the model gives one 0-1 score per judged criterion; fit is computed in code (see `combine`);
#   - conditional rules are listed under `conditional` and are OFF in this unconditioned score (R1 F6);
#   - transport rows are a `utility` class with no fit (DRV ruling on R1 F4).
site: "bestman"
version: "1.1.0"
profile: "profiles/bestman.yaml"
voice: "Garden & Gun / Field Mag / Yeti Presents"
# The scorer sees the row's own fields only (name, type, highlight, price, group, place) —
# never the legacy routing tags (brands/wizards/audiences/products/sites).
thresholds:
  low: 0.3
  good: 0.6
  ruling: "DRV CORPUS-M5-FIX1 brief, ruling on R1 F3: low <= 0.30, good >= 0.60."
combine:
  formula: "fit = K x (0.5 + 0.5 x P), rounded to 0.05. K = weighted mean of the part-kind criteria; P = weighted mean of the part-practical criteria and rules that apply to the row."
  rationale: "what the venue is and who it is for decide the band; practical fit (named, group, timing) can halve a score but can never lift a venue of the wrong kind"
scale:
  - {band: "0.60-1.00", means: "good: a venue the site would put in a bachelor weekend", rationale: "the DRV good line; known-good controls must land here"}
  - {band: "0.30-0.55", means: "middling: usable but not a pick (a placeholder, a weak venue kind)", rationale: "between the two DRV lines; M7 decides what it does with this band"}
  - {band: "0.00-0.25", means: "low: not a bachelor-weekend venue", rationale: "the DRV low line; known-bad controls without an occasion word must land here"}
caps:
  - id: "bestman-cap-strip-club"
    text: "A strip club or adult-entertainment venue scores 0.1, decided by rule from its name, type or highlight before any model call: a guys' trip, not a frat party."
    field: "name+highlight"
    pattern: "\\bstrip[- ]?clubs?\\b|\\bgentlemen'?s club\\b|\\badult entertainment\\b|\\bexotic danc"
    fit: 0.1
    cite: "profiles/bestman.yaml:49"
    quote: "no strip-club tropes"
utility:
  id: "bestman-utility"
  kinds: ["transport"]
  text: "Transport (rideshare, shuttles, vans, charters, party buses) is a utility the plan needs, not a venue: it is not graded on brand fit and gets no fit."
  ruling: "DRV CORPUS-M5-FIX1 brief, ruling on R1 F4: utility and transport rows are not graded on brand fit."
  cite: "profiles/bestman.yaml:37"
  quote: "lodging, transport, golf courses)."
occasion:
  id: "bestman-r-pitched-at-other-occasion"
  effect: "flag"
  text: "The row's copy (every text field but the name) names the other occasion (bachelorette, bride, bridal, bridesmaid, maid of honor, girls' trip, the girls) and never its own (bachelor, groom, groomsmen, best man, the guys, the boys). Set by rule; the fit is not changed by it."
  cite: "profiles/bestman.yaml:57"
  quote: "Nothing MOH-coded appears here"
  cite_2: "profiles/bestman.yaml:19"
  quote_2: "bachelorette-coded words in every output field"
rules:
  - id: "bestman-r-group"
    part: "practical"
    weight: 0.4
    rationale: "group fit is scored from the fields the site's own scorer reads; no judgement is needed"
    text: "From the fields: nightlife/dining groupFriendly true 1.0, false 0.3; activity groupMax >= 8 1.0, 4-7 0.6, < 4 0.3; lodging per-room 0.6, else maxGuests >= 8 1.0, 4-7 0.6, < 4 0.3."
    cite: "profiles/bestman.yaml:170"
    quote: "group-friendly bars/dining"
criteria:
  - id: "bestman-c-venue"
    direction: "+"
    part: "kind"
    weight: 0.7
    rationale: "the main question (what the place is) carries most of the band"
    text: "What the venue IS, judged from its type and what it offers, never from how its row is worded: is it the kind of place a sporting, field-story voice writes up for a bachelor weekend (place, operator, season, gear)? Rivers and guides, fishing and boat days, ranges and clays, steakhouses and smokehouses, whiskey, bourbon and honest bars, breweries and distilleries, outdoor days, ballgames, storied golf courses and big lodges score high. Spa and pedicure days, styled picnics and yoga retreats score low. Ignore promotional wording, and ignore the [occasion] token."
    cite: "profiles/bestman.yaml:12"
    quote: "sporting/field-story telling — place, operator, season, gear, the man it is for"
  - id: "bestman-c-audience"
    direction: "+"
    part: "kind"
    weight: 0.3
    rationale: "who it is for is the second question; lighter than venue because the two overlap"
    text: "It works for the groom's group on a bachelor weekend, organized by the best man: somewhere the group does something together."
    cite: "profiles/bestman.yaml:27"
    quote: "The groom's crew planning a bachelor party"
  - id: "bestman-c-named"
    direction: "+"
    part: "practical"
    weight: 0.4
    rationale: "specific nouns are a content rule, but a placeholder can still be the right venue kind, so it sits in the practical part"
    text: "A real, named operator (the guide, the river, the steakhouse, the boat) scores 1; an unnamed placeholder ('a fun bar', 'deep-sea fishing charter', 'private poker night') scores 0.2."
    cite: "profiles/bestman.yaml:53"
    quote: "Specific nouns beat bluster"
  - id: "bestman-c-day-window"
    direction: "-"
    part: "practical"
    weight: 0.2
    rationale: "a timing rule that marks down few rows; the smallest practical weight"
    text: "Scores 1 unless the thing only happens before 10 AM (sunrise-only, dawn departures), which scores 0.2."
    cite: "profiles/bestman.yaml:73"
    quote: "Day activities 10:00 AM–4:00 PM (never before 10:00)."
notes:
  - id: "bestman-n-golf"
    text: "Golf courses are in the catalog and golf is an allowed activity: judge a course like any venue (a named, storied course scores up; an anonymous municipal nine scores lower)."
    cite: "profiles/bestman.yaml:37"
    quote: "lodging, transport, golf courses)."
  - id: "bestman-n-international"
    text: "International destinations are fully plannable: a row is not marked down for being outside the US."
    cite: "profiles/bestman.yaml:41"
    quote: "21 international catalog destinations are fully plannable and in the picker"
# Conditional on user input: OFF in the unconditioned score (never shown to the scorer, weight 0).
conditional:
  - id: "bestman-k-mixed-gen"
    applies_when: "mixedGenerations is set"
    text: "Steakhouses, whiskey bars and cigar lounges score up."
    cite: "profiles/bestman.yaml:61"
    quote: "tilt to steakhouses/whiskey bars/cigar lounges"
  - id: "bestman-k-age-range"
    applies_when: "the user picks an age range"
    text: "Clubs suit the younger groups; steakhouses and dive bars the older ones."
    cite: "profiles/bestman.yaml:162"
    quote: "21-25/25-30 reward clubs (+10); 35-40/40+ reward steakhouses (+10) and dive bars (+5)"
  - id: "bestman-k-big-group"
    applies_when: "the group is 14 or more"
    text: "Big-group activities matter."
    cite: "profiles/bestman.yaml:170"
    quote: "big-group activities at 14+"
reason_rules:
  text: "One sentence, at most 160 characters. Start with the id of the criterion that decided the score, written in full (for example bestman-c-venue); never shorten an id. Say what the venue is and why it fits or does not; never comment on how the row is written. Never write these banned words, singular or plural, not even inside a quote of the row's own text: king, goat, legend, premium, world-class, trusted, cutting-edge, gold chain, and no emoji; never the MOH register (her, she, the bride). Never write generic, filler, hype, blurb or copy. Paraphrase instead."
  banned_cite: "profiles/bestman.yaml:15"
  banned_quote: "banned_words: [\"world-class\", \"premium\", \"trusted\", \"cutting-edge\""

        - generic [ref=e134]: Meet us in Atlanta, and we’ll show you what it means to have fun, Southern-style. Our vibrant capital city is the living, breathing cultural heart of the American South, where world-renowned chefs, business moguls and celebrities flock for work and play. Our luxury hotel in Midtown Atlanta puts you just steps from the renowned High Museum of Art, eclectic Peachtree Street and the sprawling green spaces of Piedmont Park. Enjoy breakfast on the atrium bridge before heading out to explore the city, or stay in for a healthy dose of self-care in our serene Spa. However you spend the day, make sure to end your night with dinner and drinks at Bar Margot.

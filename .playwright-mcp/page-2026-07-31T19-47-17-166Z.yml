                        - heading "Balinese Tribal Lion Bench" [level=3]
                        - paragraph: Handcrafted by village artisans in Indonesia, this Tribal Lion Bench is a proud find from Bali. It was carved from a single length of hardwood, with four solid wooden legs completing the piece. Animals are part of daily life in these remote regions, so they often appear in wood carving, textiles, and other art. The spiral and circular details were etched to reflect traditional designs typical of West Timor.

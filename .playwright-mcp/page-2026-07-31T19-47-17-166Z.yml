            - generic [ref=f52e616]:
              - generic [ref=f52e619]:
                - paragraph [ref=f52e620]: About the Design of Our Boutique Hotel
                - heading "Inspired by Global Travels, Grounded by a Sense of Home" [level=2] [ref=f52e621]
                - generic [ref=f52e622]: "The Burgess Hotel, the first boutique hotel to open its doors in the elegant Buckhead neighborhood of Atlanta, was inspired by two seemingly disparate design ideas: to create a sense of home and to reflect the life of travel enjoyed by the owners. These colorful and inspiring collectibles reflect not only life experiences – but also remarkable artifacts and artwork. They are proud to bring them all to life in an eclectic, contemporary, and invigorating hotel that evokes a spirit of adventure and discovery. From the thoughtfully designed open-concept lobby to each individual guest room and internationally themed suite and luxurious penthouse, you’ll admire treasures from around the globe – in a warm atmosphere that feels very much like home."

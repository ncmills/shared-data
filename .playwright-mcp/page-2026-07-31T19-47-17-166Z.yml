            - generic [ref=f52e598]:
              - generic [ref=f52e601]:
                - paragraph [ref=f52e602]: Buckhead's First Boutique Hotel
                - heading "Ideally Situated for Exploration" [level=2] [ref=f52e603]
                - generic [ref=f52e604]: The Burgess Hotel is located at the end of Piedmont Road in Buckhead, giving you quick access to Atlanta to the south, just six miles away. We’re well-positioned for leisure and business travelers, right in the heart of Atlanta’s elegant Buckhead neighborhood minutes from the financial center. World-class dining, art galleries, entertainment, sporting venues, and shopping are all nearby, and popular lunch spots are a short walk from our door. Explore further afield in Atlanta. Stroll the pathways of the breathtaking Botanical Garden. Hop on the thrilling Skyview Atlanta Ferris wheel. Eat and shop your way through the Ponce City Market. And visit fascinating museums and historic homes. The Burgess Hotel in Buckhead puts you at the center of it all.
                - button "See More" [ref=f52e606] [cursor=pointer]
                - link "Learn More" [ref=f52e608] [cursor=pointer]:

              - generic [ref=f52e439]:
                - paragraph [ref=f52e440]: Our Story
                - heading "About The Burgess Hotel" [level=2] [ref=f52e441]
                - generic [ref=f52e442]: As world travelers, it has been the dream of the Jokhis to share the story of their travels through hospitality. Thus was The Burgess Hotel born, a Tribute Portfolio Hotel and Buckhead’s first boutique hotel. Inspired by a desire to live fully “in the moment,” this full-service lifestyle property veers away from the status quo and toward a more personal experience. It’s equal parts charismatic and playful, adorned with eye-catching colors and original artifacts from Asia and beyond. The design scheme is bespoke and eclectic. Lavish and inviting. Graced with original paintings and digital collages by the owner’s artist-daughter, Jessica. It all converges into a cosmopolitan elegance you’ve never seen, an aesthetic that embraces art and leisure – without feeling extravagant. The Jokhis consider The Burgess Hotel an extension of their home, and they welcome you into its thoughtfully designed rooms with open arms.
                - button "See More" [ref=f52e444] [cursor=pointer]
              - img "Lobby" [ref=f52e448]
            - generic [ref=f52e452]:
              - generic [ref=f52e455]:
                - paragraph [ref=f52e456]: Spotlight on the Owners
                - heading "Pioneers in the High-End Buckhead Hotel Scene" [level=2] [ref=f52e457]
                - generic [ref=f52e458]: The perfect marriage of timeless cultural treasures and contemporary style, The Burgess Hotel reflects the eclecticism and personal styles of the hotel owners. Burges helms the kitchen as Executive Chef at Fia Restaurant, bringing to every plate his culinary expertise from Johnson & Wales and the skills he refined as a caterer to the United Nations and exclusive New York social circles. Freny’s, a Rhode Island School of Design graduate, with an eye for fashionable interiors, sourced some of the hotel's furnishings from their favorite travels. This boutique experience is complemented by the remarkable artwork from Jessica Jokhi, creating an atmosphere unlike any other in the affluent neighborhood of Buckhead.
                - button "See More" [ref=f52e460] [cursor=pointer]
              - img "Lobby - Long Table" [ref=f52e464]

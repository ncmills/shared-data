            - generic [ref=f52e580]:
              - generic [ref=f52e583]:
                - paragraph [ref=f52e584]: Meetings & Events
                - heading "Your Next Memorable Gathering Starts Here" [level=2] [ref=f52e585]
                - generic [ref=f52e586]: Whether you are here for a board meeting, a team meeting, a bridal shower or a family reunion, The Burgess Hotel is an ideal boutique setting for your gathering. Our expert planning team ensures your event runs seamlessly, freeing you up to be fully present for your agenda – or your celebration. Custom high-end catering, state-of-the-art audio-visual equipment, video conferencing, and fun group outings tell just part of the story of all we can arrange for your distinctive event. Reserve the 345-square-foot Dynasty Room as a VIP Boardroom or for private dining up to 12. Its eclectic design touches are sure to energize your meeting. Choose the elegant 874-square-foot Mosaic Room for a larger group – up to 50 theater style.
                - button "See More" [ref=f52e588] [cursor=pointer]
                - link "Learn More" [ref=f52e590] [cursor=pointer]:

                        - heading "Front Desk Mother of Pearl Inlay" [level=3]
                        - paragraph: This custom piece came to us from India. The mother of pearl was harvested from the sea, carefully cut from the inner shell layer of a mollusk. Its iridescence is its most stunning quality, though it is also quite strong and resilient. You can find this type of decorative furniture in many East Asian and Middle Eastern homes. Our grandparents’ homes had pieces much like this.

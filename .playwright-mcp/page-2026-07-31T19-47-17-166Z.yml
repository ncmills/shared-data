                        - heading "Traditional Chinese Brush Paintings" [level=3]
                        - paragraph: Chinese brush painting is one of the oldest forms of artistic expression in China. The pair on either side of the front entrance have been in our family for many years. Kuku Bunshah, mother of The Burgess Hotel owner, Freny Jokhi, painted these cherished pieces of art when she lived in Hong Kong. Though Kuku was a commercial artist, she worked with many different mediums.

name: Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  audit:
    name: Coverage audit (under-tagged / orphaned / starved regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Runs FIRST: the Record<WizardTag, …> maps that decide what each wizard
      # reads are only enforced by the compiler. Without this step they were
      # editor-only decoration — a missing key read back `undefined` at runtime
      # and every other step below happily passed.
      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npx tsx --test $(find scripts src -name "*.test.ts")

      - name: Run universe + brand-rule verification
        run: npm run verify

      - name: Run coverage audit (fails on new regressions beyond docs/audit-baseline.json)
        run: npm run audit

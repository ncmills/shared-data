not_rules:
  - id: "engagedmoon-group-eligibility"
    why: "conditional: depends on user input or page"
    what: "Drops activity rows whose groupMax < party size (always), or whose groupMin > party size when type is in MIN_IS_STRUCTURAL."
    cite: "engagedmoon/src/lib/trip.ts:345-385@c2518db; applied engagedmoon/src/lib/trip-context.ts:169@c2518db, engagedmoon/src/lib/trip.ts:536-538@c2518db, engagedmoon/scripts/build-viable-destinations.ts:117-121@c2518db"
    quote: "if (row.groupMax != null && partySize > row.groupMax) return false;"
  - id: "engagedmoon-breakfast-coded-dinner"
    why: "conditional: depends on user input or page"
    what: "Drops breakfast/brunch-coded dining rows from the single-evening dinner slot (spot pages / catalog.ts). Not applied to the multi-day wizard pool."
    cite: "engagedmoon/src/lib/trip.ts:466-478@c2518db; engagedmoon/src/lib/trip.ts:500-501@c2518db"
    quote: "if (row.bestFor) return /brunch|breakfast/i.test(row.bestFor);"
  - id: "engagedmoon-same-venue-as-keystone"
    why: "conditional: depends on user input or page"
    what: "Drops 'morning after' activity rows that name the same venue as the proposal spot (all words of any >=2-word, non-city/state segment of the spot name appear in the activity name)."
    cite: "engagedmoon/src/lib/trip.ts:271-293@c2518db; engagedmoon/src/lib/trip.ts:542-544@c2518db"
    quote: "(a) => !isSameVenueAsSpot(a.name, spot.name, dest ?? {}),"
  - id: "engagedmoon-capstone-ineligible-spot"
    why: "not a facts row in v1: proposal spots are not suitability rows yet"
    what: "Drops proposal spots with capstoneEligible false from keystone selection and swap."
    cite: "engagedmoon/src/lib/keystone.ts:71-74@c2518db"
    quote: "(s) => s.destinationId === destinationId && s.capstoneEligible,"
  - id: "engagedmoon-spot-unresolved-anchor"
    why: "not a facts row in v1: proposal spots are not suitability rows yet"
    what: "Drops proposal spots whose destinationId does not resolve in the shared destination catalog."
    cite: "engagedmoon/src/lib/proposal-spots.ts:344-348@c2518db"
    quote: "if (!dest) return null;"
  - id: "engagedmoon-month-page-seasonal-closure"
    why: "conditional: depends on user input or page"
    what: "On /best-for/[month] pages, drops launch spots whose seasonalClosure parses as shut in that month (unknown stays listed, labelled)."
    cite: "engagedmoon/src/app/(site)/best-for/[month]/page.tsx:46-48@c2518db; engagedmoon/src/app/(site)/best-for/[month]/page.tsx:60-61@c2518db"
    quote: "return LAUNCH_SPOTS.filter((s) => !shutInMonth(s, mi));"
soft_fit:
  - id: "engagedmoon-lodging-rank"
    text: "All lodging types allowed; quiet ones first: boutique-hotel, resort, house, hotel, airbnb, then anything else."
    cite: "engagedmoon/src/lib/trip.ts:176-183@c2518db"
    quote: "/** Somewhere to stay. All lodging types are fine; quiet ones come first. */"
  - id: "engagedmoon-interest-sort-not-filter"
    text: "Activities matching stated interests are sorted first; never filtered out."
    cite: "engagedmoon/src/lib/trip-context.ts:103-106@c2518db"
    quote: "* A SORT, NOT A FILTER, and that is the whole design. Filtering to the picked"
  - id: "engagedmoon-keystone-ranking"
    text: "Keystone spot order: rated privacy desc (unrated not zero), then has crowd notes, then id."
    cite: "engagedmoon/src/lib/keystone.ts:71-80@c2518db"
    quote: "const privacy = (b.privacy ?? 0) - (a.privacy ?? 0);"
  - id: "engagedmoon-keystone-day"
    text: "Keystone lands on the last full day (day 2 for two nights), so the trip has an after."
    cite: "engagedmoon/src/lib/keystone.ts:114-116@c2518db"
    quote: "return Math.max(1, numberOfDays <= 2 ? numberOfDays : numberOfDays - 1);"
  - id: "engagedmoon-default-session-evening"
    text: "Default keystone session is 'evening' as a fallback, not a claim; never promoted into marketing copy."
    cite: "engagedmoon/src/lib/keystone.ts:127@c2518db"
    quote: "export const DEFAULT_KEYSTONE_SESSION: DaySession = \"evening\";"
  - id: "engagedmoon-nights-per-city"
    text: "Nights clamped 2-4 per city, derived as floor(usable activities / 2)."
    cite: "engagedmoon/scripts/build-viable-destinations.ts:199-200@c2518db"
    quote: "maxNights: Math.max(2, Math.min(4, Math.floor(acts.length / 2))),"
image_rules:
  - id: "engagedmoon-query-place-not-moment"
    text: "Image queries name the PLACE; never 'proposal', 'engagement', 'couple' or 'ring'."
    cite: "engagedmoon/BRAND.md:185@c2518db"
    quote: "- **Query the PLACE, never the moment.** The loader deliberately never queries \"proposal\", \"engagement\", \"couple\" or \"ring\""
  - id: "engagedmoon-missing-photo-designed-state"
    text: "A missing photograph falls back to the sky gradient; not a hole."
    cite: "engagedmoon/BRAND.md:186@c2518db"
    quote: "- **A missing photograph is a designed state, not a hole.**"
  - id: "engagedmoon-alt-from-our-data"
    text: "Alt text is composed from our data, never the cache's upstream caption."
    cite: "engagedmoon/BRAND.md:187@c2518db"
    quote: "- **Alt text is composed from OUR data**, never the cache's."
  - id: "engagedmoon-verify-rendered-pixels"
    text: "Every image verified by viewing rendered pixels at production crop before shipping; rejections logged."
    cite: "engagedmoon/BRAND.md:188@c2518db"
    quote: "- **Every image is verified by looking at the rendered pixels at its production crop before it ships.**"
  - id: "engagedmoon-credit-required"

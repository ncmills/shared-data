# profiles/engagedmoon.yaml — CORPUS-M4 site profile (tagger input). Every rule cites <repo>/<file>:<line>@<sha>;
# anything the repo does not state is ABSENT. hard_excludes → suitability/engagedmoon.json eligible "no" (rules@<blob sha of this file>).
# not_rules = deterministic filters found in the site that are NOT row rules here, with the reason. Read by scripts/corpus/suitability.ts.
site: "engagedmoon"
repo: "engagedmoon"
ref: "c2518db"
shared_data_ref: "dde2cb7"
vocab: "1.0.0"
brand_source:
  cite: "engagedmoon/BRAND.md@c2518db"
voice:
  summary: "Plain, specific, quietly confident; numbers over adjectives (about the trip: nights, party size, inclusions); never breathless; never promises a feeling; the moment gets weight through placement, not adjectives. Register of a good jeweller or serious restaurant; gender-neutral in tone and nouns."
  cite: "engagedmoon/BRAND.md:92-95@c2518db"
  quote: "- Plain, specific, quietly confident. **Numbers over adjectives**, but about the *trip* — nights, party size, what's included — not about the light."
  banned_words: ["Unforgettable", "magical", "the perfect moment"]
  cite_banned: "engagedmoon/BRAND.md:94@c2518db"
  quote_banned: "- **The copy never promises a feeling.** \"Unforgettable\", \"magical\", \"the perfect moment\" are what every vendor in this category writes, they are unfalsifiable"
audience:
  summary: "An uncertain initiator who has decided to propose and nothing else; buying taste they lack, i.e. confidence the trip will land with the partner. Proposer is the reader; partner is the one who does not know."
  cite: "engagedmoon/BRAND.md:62@c2518db"
  quote: "**An uncertain initiator.** They have decided to propose and that is genuinely all they have decided."
group_size:
  min: 2
  max: 10
  cite: "engagedmoon/src/lib/validate.ts:44@c2518db; engagedmoon/src/lib/validate.ts:134-137@c2518db"
  quote: "export const MAX_GROUP_SIZE = 10;"
product:
  summary: "A 2-4 night trip for a couple OR a group with exactly one itinerary item named as the proposal (the keystone), the days built to lead to it. Sibling of BMHQ/MOH/HHQ/OO with exactly three deltas: branding, trip parameters, keystone."
  cite: "engagedmoon/BRAND.md:37@c2518db"
  quote: "A genuinely good trip — **for a couple OR a group** — with **one moment in it named as the proposal**, and the whole itinerary built to lead there."
geography:
  summary: "Only the 43 catalog destinations in src/data/proposal-ready.json can be planned (all US states + DC at this sha). validateWizardState throws for any other destination; 'surprise me' resolves only from this list."
  allow: ["sedona-az", "key-west-fl", "bozeman-mt", "honolulu-hi", "stowe-vt", "asheville-nc", "park-city-ut", "jackson-hole-wy", "portland-or", "san-diego-ca", "washington-dc", "hood-river-or", "hilton-head-sc", "santa-barbara-ca", "aspen-co", "moab-ut", "traverse-city-mi", "fredericksburg-tx", "st-augustine-fl", "walla-walla-wa", "whitefish-mt", "lake-placid-ny", "door-county-wi", "mackinac-island-mi", "chicago-il", "palm-springs-ca", "los-angeles-ca", "outer-banks-nc", "salt-lake-city-ut", "seattle-wa", "spokane-wa", "sun-valley-id", "telluride-co", "newport-ri", "savannah-ga", "las-vegas-nv", "denver-co", "finger-lakes-ny", "oahu-hi", "bend-or", "cannon-beach-or", "leavenworth-wa", "san-francisco-ca"]
  cite: "engagedmoon/src/lib/validate.ts:125-129@c2518db; engagedmoon/src/lib/viable-destinations.ts:57-59@c2518db; engagedmoon/src/data/proposal-ready.json@c2518db"
  quote: "`We don't plan trips in \"${destination || \"(nowhere)\"}\" yet. Pick one of the ${VIABLE_DESTINATIONS.length} cities on the list.`,"
content_rules:
  - id: "engagedmoon-real-rows-only"
    text: "Never name a place that is not a real catalog row; when there is no row, say so with HONESTY.unnamedKeystone. Outranks every other rule."
    cite: "engagedmoon/BRAND.md:211@c2518db"
    quote: "- **Never name a place that is not a real catalog row.** This is the one that outranks the others."
  - id: "engagedmoon-no-clock-time"
    text: "Never state a clock time at all — computed, model-produced or hedged."
    cite: "engagedmoon/BRAND.md:212@c2518db"
    quote: "- **Never state a clock time at all.** Not a computed one, not a model's, not a hedged one."
  - id: "engagedmoon-no-time-in-generation"
    text: "Generator prompt: no stated time anywhere (incl. 'at sunset', 'golden hour'); only morning/midday/afternoon/evening."
    cite: "engagedmoon/src/lib/proposal-planner-prompt.ts:172-174@c2518db"
    quote: "2. NEVER STATE A TIME. Not for the moment, not for dinner, not anywhere. No"
  - id: "engagedmoon-timing-not-a-feature"
    text: "Any copy stating WHEN the proposal happens is stale v2 copy (golden hour, sunset windows, coordinates, permits, lead times are all cut)."
    cite: "engagedmoon/BRAND.md:58@c2518db"
    quote: "**Timing is not a feature.** If copy anywhere states *when* the proposal happens, that is stale v2 copy — not house style."
  - id: "engagedmoon-keystone-real-place-or-none"
    text: "The keystone panel names a real place or names none, using HONESTY.unnamedKeystone verbatim."
    cite: "engagedmoon/BRAND.md:173@c2518db"
    quote: "1. **It names a real place or it names none.** Where the catalog cannot supply a spot, the panel says so in the site's own words — `HONESTY.unnamedKeystone` in `src/lib/brand.ts`"
  - id: "engagedmoon-keystone-weight-not-adjectives"
    text: "The keystone is made a big deal of by weight and placement, never by calling it special."
    cite: "engagedmoon/BRAND.md:174@c2518db"
    quote: "2. **Weight, never adjectives.** The panel is how the site \"makes a big deal\" of the moment — dark surface, large type, its own section."
  - id: "engagedmoon-keystone-what-not-when"
    text: "The keystone says what happens, never when — no clock time, no window, no light."
    cite: "engagedmoon/BRAND.md:175@c2518db"
    quote: "3. **It says what happens, never when.** No clock time, no window, no light."
  - id: "engagedmoon-unnamed-keystone-sentence"
    text: "Single-source sentence rendered where no keystone place can be named."
    cite: "engagedmoon/src/lib/brand.ts:150-151@c2518db"
    quote: "\"We'll set the moment aside in the itinerary, but we won't name a spot we can't stand behind.\","
  - id: "engagedmoon-no-promised-feeling"
    text: "Never promise a feeling; unfalsifiable adjectives are banned."
    cite: "engagedmoon/BRAND.md:213@c2518db"
    quote: "- **Never promise a feeling.** Unfalsifiable adjectives are the category's house style and the opposite of this site's."
  - id: "engagedmoon-no-feelings-generation-list"
    text: "Generator prompt's banned feeling words: Unforgettable, magical, the perfect moment, dreamy, swoon, hidden gem, curated, elevated, breathtaking."
    cite: "engagedmoon/src/lib/proposal-planner-prompt.ts:199-200@c2518db"
    quote: "6. NO FEELINGS SOLD. \"Unforgettable\", \"magical\", \"the perfect moment\","
  - id: "engagedmoon-register"
    text: "Elegant and professional; neither wedding-blog frill (dreamy, swoon, script faces, blush) nor bachelor-party register."
    cite: "engagedmoon/BRAND.md:70@c2518db"
    quote: "**Register: elegant and professional.** Not girly, not bro-y — both failure modes are fatal and for the same reason."
  - id: "engagedmoon-demonstrate-taste"
    text: "Demonstrate taste, never claim it: 'tastefully curated', 'thoughtfully designed', 'elegant' are banned as claims."
    cite: "engagedmoon/BRAND.md:78@c2518db"
    quote: "- **Demonstrate taste; never claim it.** *Tastefully curated*, *thoughtfully designed*, *elegant* are the same unfalsifiable move as *magical*."
  - id: "engagedmoon-gender-neutral"
    text: "Gender-neutral throughout in tone and nouns; say 'your partner'."
    cite: "engagedmoon/BRAND.md:88@c2518db"
    quote: "**Gender-neutral throughout, in tone as well as nouns.** Rendered copy says \"your partner\" and assumes nothing about either person"
  - id: "engagedmoon-propose-before-trip"
    text: "In headlines/titles/descriptions, say 'propose' before 'trip'."
    cite: "engagedmoon/BRAND.md:27@c2518db"
    quote: "1. **Say \"propose\" before you say \"trip.\"**"
  - id: "engagedmoon-verbs-ours"
    text: "Prefer Show me / Build mine / Start from this trip over 'Plan'; no exceptions."
    cite: "engagedmoon/BRAND.md:81@c2518db"
    quote: "- **The verbs are ours, not theirs.** Prefer *Show me* / *Build mine* / *Start from this trip* over *Plan* — \"plan\" asks the reader to supply the plan."
  - id: "engagedmoon-no-social-proof"
    text: "No fabricated social proof, ever (BANNED_SOCIAL_PROOF in runtime guard and source lint)."
    cite: "engagedmoon/BRAND.md:214@c2518db"
    quote: "- **No fabricated social proof, ever.** Portfolio-wide hard rule, enforced by `BANNED_SOCIAL_PROOF` in both the runtime guard and the source lint."
  - id: "engagedmoon-no-invented-lead-times"
    text: "Generator may not state booking lead times (days/weeks/months) it was not given."
    cite: "engagedmoon/src/lib/proposal-planner-prompt.ts:209-213@c2518db"
    quote: "9. NO LEAD TIMES YOU WERE NOT GIVEN. Never \"book at least four weeks ahead\","
  - id: "engagedmoon-group-message-no-proposal"
    text: "On group trips the organiser's message to the others must not mention the proposal."
    cite: "engagedmoon/src/lib/proposal-planner-prompt.ts:143@c2518db"
    quote: "\"groupMessage\": \"The message the organiser sends the others. It must NOT mention the proposal — one of the recipients could show it to the partner.\""
  - id: "engagedmoon-not-a-party-register"
    text: "Model instruction: not a party — no bar crawls, bottle service, drinking circuits, bachelor/bachelorette, corporate/offsite, golf; rewrite party-register rows in own words."
    cite: "engagedmoon/src/lib/brand.ts:323-329@c2518db"
    quote: "\"THIS IS NOT A PARTY. No bar crawls, no bottle service, no drinking circuits,\","
  - id: "engagedmoon-sibling-vocabulary-banned"
    text: "BANNED_PATTERNS (complete): sibling brand names; bachelor/bachelorette vocab; corporate vocab; golf vocab. Enforced over repo source at prebuild and on generated/user-facing text at runtime."
    cite: "engagedmoon/src/lib/brand.ts:173-231@c2518db"
    quote: "export const BANNED_PATTERNS: readonly RegExp[] = ["
  - id: "engagedmoon-group-framing-not-banned"
    text: "Group framing in OUR copy is allowed and must not be re-banned; the row-level groups? ban is separate."
    cite: "engagedmoon/BRAND.md:201@c2518db"
    quote: "> **Group framing is no longer banned, and must not be re-banned.**"
  - id: "engagedmoon-atlas-no-word-group"
    text: "Hand-authored atlas entries may not contain the word 'group' (CATALOG_ROW_BANNED runs over them); write 'a party of eight' etc."
    cite: "engagedmoon/src/data/long-way-trips.ts:63-68@c2518db"
    quote: "* ⚠️ THE WORD \"GROUP\" CANNOT APPEAR IN AN ENTRY, and that is not a positioning"
  - id: "engagedmoon-share-whitelist"
    text: "The partner-facing shared view is a whitelist projection of four fields, never a redaction."
    cite: "engagedmoon/BRAND.md:225@c2518db"
    quote: "`src/lib/share.ts` builds `SharedTripView` by **whitelist** — four fields, explicitly listed."

# profiles/friendsmoon.yaml — CORPUS-M4 site profile (tagger input). Every rule cites <repo>/<file>:<line>@<sha>;
# anything the repo does not state is ABSENT. hard_excludes → suitability/friendsmoon.json eligible "no" (rules@<blob sha of this file>).
# not_rules = deterministic filters found in the site that are NOT row rules here, with the reason. Read by scripts/corpus/suitability.ts.
site: "friendsmoon"
repo: "friendsmoon"
ref: "3812b3a"
shared_data_ref: "dde2cb7"
vocab: "1.0.0"
brand_source:
  cite: "friendsmoon/BRAND.md@3812b3a"
voice:
  summary: "Warm, plain, specific. Short sentences, concrete nouns, the tone of a friend who has organised one of these. No exclamation, no hype, no invented social proof, and always say who pays."
  cite: "friendsmoon/BRAND.md:213-219@3812b3a"
  quote: "**Warm, plain, specific.** Short sentences. Concrete nouns. The tone of a friend who has actually organised one of these."
  banned_words: ["unforgettable", "epic", "the ultimate", "bucket list", "dream trip", "dream weekend", "dream getaway"]
  cite_banned: "friendsmoon/src/lib/brand.ts:168-176@3812b3a"
  quote_banned: "export const HYPE_WORDS = [ \"unforgettable\", \"epic\", \"the ultimate\", \"bucket list\", \"dream trip\", \"dream weekend\", \"dream getaway\", ] as const;"
audience:
  summary: "A just-married couple and the friends they pick, on the trip right after the wedding (instead of the honeymoon, or before it). Not the pre-wedding party. Two shapes: couples path (pairs, rooms matter) and crew path (whole group, whole-unit rentals)."
  cite: "friendsmoon/BRAND.md:14-17,40-41@3812b3a"
  quote: "Friendsmoon plans the **trip a just-married couple takes with their friends** — the one"
  quote_2: "- **Couples path** — pairs, quieter, rooms matter, split-the-house economics."
group_size:
  min: 2
  max: 40
  cite: "friendsmoon/src/lib/plan.ts:106-109@3812b3a"
  quote: "export const GUEST_MIN = 2; export const GUEST_MAX = 40; export const NIGHT_MIN = 2; export const NIGHT_MAX = 5;"
  nights:
    min: 2
    max: 5
    cite: "friendsmoon/src/lib/plan.ts:108-109@3812b3a"
    quote: "export const NIGHT_MIN = 2; export const NIGHT_MAX = 5;"
  input_handling:
    text: "Out-of-range query values are clamped, not rejected; guests defaults to 12, nights to 3, shape to crew unless 'couples'."
    cite: "friendsmoon/src/lib/plan.ts:129-131@3812b3a"
    quote: "guests: clamp(Number(one(sp.guests)) || 12, GUEST_MIN, GUEST_MAX), nights: clamp(Number(one(sp.nights)) || 3, NIGHT_MIN, NIGHT_MAX), shape: one(sp.shape) === \"couples\" ? \"couples\" : \"crew\","
product:
  summary: "A deterministic post-wedding group-trip (long weekend) planner. Four questions (place, headcount, nights, group shape); the plan is a pure function of those inputs, and the plan IS its URL. No invite-list tooling."
  cite: "friendsmoon/BRAND.md:34-36@3812b3a"
  quote: "The wizard asks four questions — place, headcount, nights, group shape. It does **not** manage an invite list."
geography:
  summary: "No geographic restriction rule is stated anywhere in the repo. Destinations are whatever shared-data rows carry a friendsmoon-tagged lodging row. The region vocabulary includes 'international' (rendered 'abroad'), so non-US destinations are a recognised region, not excluded."
  allow: ["northeast", "south", "midwest", "west", "international"]
  cite: "friendsmoon/src/lib/seo.ts:52-58@3812b3a"
  quote: "export const REGION_LABEL: Record<string, string> = { northeast: \"the Northeast\", south: \"the South\", midwest: \"the Midwest\", west: \"the West\", international: \"abroad\", };"
  rule_status: "ABSENT (see absent[0]); the allow list above is the region label map, not a filter"
content_rules:
  - id: "friendsmoon-honeymoon-anchor"
    text: "Say 'honeymoon' before 'friendsmoon'; never use 'honeymoon' only as a negation."
    cite: "friendsmoon/BRAND.md:19-21@3812b3a"
    quote: "**Say \"honeymoon\" before you say \"friendsmoon.\"** (Locked 2026-08-17.) \"Friendsmoon\" is an invented word and nobody searches it; \"honeymoon\" is the category every reader"
  - id: "friendsmoon-instead-or-before"
    text: "The relationship to the honeymoon is 'instead of, or before it'; never claim outright replacement."
    cite: "friendsmoon/BRAND.md:26-28@3812b3a"
    quote: "The relationship is **\"instead of the honeymoon, or before it.\"** Both halves are load- bearing. Claiming outright replacement buys a sharper line by making"
  - id: "friendsmoon-no-invite-tooling"
    text: "Copy may say you pick who comes; it may never imply invite-list tooling."
    cite: "friendsmoon/BRAND.md:35-36@3812b3a"
    quote: "Copy may say *you pick who comes and we plan around them*; it may never imply invite tooling."
  - id: "friendsmoon-concrete-not-curated"
    text: "Prefer concrete description over brochure phrasing."
    cite: "friendsmoon/BRAND.md:216@3812b3a"
    quote: "- Say \"six bedrooms and one long table,\" not \"curated accommodations.\""
  - id: "friendsmoon-no-exclaim-no-hype"
    text: "Never exclaim, never hype; HYPE_WORDS is machine-checked."
    cite: "friendsmoon/BRAND.md:217@3812b3a"
    quote: "- Never exclaim. Never hype. The `HYPE_WORDS` list is machine-checked."
  - id: "friendsmoon-no-social-proof"
    text: "No testimonials, review counts or logos."
    cite: "friendsmoon/BRAND.md:218@3812b3a"
    quote: "- **Never invent social proof** — no testimonials, review counts or logos."
  - id: "friendsmoon-say-who-pays"
    text: "Anything called 'covered' must name the payer."
    cite: "friendsmoon/BRAND.md:219@3812b3a"
    quote: "- **Say who pays.** Copy that calls a thing \"covered\" without naming the payer is banned."
  - id: "friendsmoon-no-sibling-brands"
    text: "Sibling brand names, sibling accent hexes, serif display faces and HYPE_WORDS are banned (lint + runtime)."
    cite: "friendsmoon/BRAND.md:285-290@3812b3a"
    quote: "- Sibling brand names."
  - id: "friendsmoon-sibling-name-patterns"
    text: "Complete sibling-name regex list: best man hq, bestmanhq, maid of honor hq, maidofhonorhq, handicap hq, handicaphq, offsite outpost, offsiteoutpost, engagedmoon, proposalmoon, tour de fore; plus the font name fraunces."
    cite: "friendsmoon/src/lib/brand.ts:235-248,265@3812b3a"
    quote: "/\\bbest\\s*man\\s*hq\\b/i,"
  - id: "friendsmoon-bachelor-not-linted"
    text: "'bachelor party'/'bachelorette party' is deliberately NOT machine-checked in authored copy (the homepage disclaimer uses it correctly)."
    cite: "friendsmoon/BRAND.md:294-296@3812b3a"
    quote: "**Deliberately NOT machine-checked: \"bachelor party\" / \"bachelorette party.\"** A regex cannot see the qualifier that matters — *as the thing this site plans*."
  - id: "friendsmoon-catalog-prose-wrong-occasion"
    text: "Catalog prose (highlight fields, incl. golf) is voice-rewritten and any SENTENCE matching a banned pattern or WRONG_OCCASION is dropped (sentence-level, not row-level)."
    cite: "friendsmoon/src/lib/voice.ts:120-124@3812b3a"
    quote: "const bad = (s: string) => findBannedPatterns(s).length > 0 || WRONG_OCCASION.test(s);"
  - id: "friendsmoon-model-never-generates"
    text: "/api/refine returns only the four inputs; /api/ask is read-only; neither may become a generator."
    cite: "friendsmoon/BRAND.md:308-311@3812b3a"
    quote: "`/api/refine` returns *four values* — place, headcount, nights, group shape — and the plan is rebuilt deterministically; the model never emits a venue, a price or a sentence of itinerary."
hard_excludes:
  - id: "friendsmoon-wrong-occasion"
    text: "A party row whose NAME names the wedding party (bachelor/ette, hen, stag, bride, groom…) is dropped on both paths. Golf rows are not tested."
    match: {all: [{facet: "kind", in: ["nightlife", "dining", "activity", "lodging", "transport"]}, {lexicon: "lexicon.wrong-occasion", field: "name", terms: ["\\b(bachelorette|bachelor part(y|ies)|bach part(y|ies)|hen (party|do|night)|stag (party|do|night)|groomsmen|bridesmaids?|bridal (party|shower)|bride|groom)\\b"]}]}
    cite: "friendsmoon/src/lib/catalog.ts:67-68@3812b3a"
    quote: "export const WRONG_OCCASION ="
    cite_2: "friendsmoon/src/lib/catalog.ts:67-68,83-92@3812b3a"
    quote_2: "const rightOccasion = (row: { name?: string }): boolean => !WRONG_OCCASION.test(row.name ?? \"\");"
    applies_to: ["rows"]
not_rules:
  - id: "friendsmoon-wizard-tag"
    why: "tag-keyed: wizards includes friendsmoon — the legacy tag this layer replaces (see G-diff)"
    what: "Drops lodging, dining and transport rows not tagged 'friendsmoon' on every path; drops activity and nightlife rows not tagged 'friendsmoon' on the couples path and on every indexed page."
    cite: "friendsmoon/src/lib/catalog.ts:28,87-88,241-245@3812b3a"
    quote: "const forUs = (row: Tagged & { name?: string; highlight?: string }): boolean => !!row.wizards?.includes(WIZARD) && rightOccasion(row);"
  - id: "friendsmoon-crew-extra-wizards"
    why: "conditional: depends on user input or page"
    what: "Crew path only: activity and nightlife rows tagged bestman or moh are admitted in addition to friendsmoon-tagged rows (a widening, not a drop; couples + indexed views exclude them)."
    cite: "friendsmoon/src/lib/catalog.ts:42,89-92,232@3812b3a"
    quote: "const CREW_EXTRA_WIZARDS = [\"bestman\", \"moh\"] as const;"
  - id: "friendsmoon-no-lodging-no-destination"
    why: "destination-level and derived from the other filters, not a property of a row"
    what: "Drops a whole destination when no lodging row survives the forUs filter."
    cite: "friendsmoon/src/lib/catalog.ts:177,204@3812b3a"
    quote: ".filter((d) => d.lodging.length > 0)"
  - id: "friendsmoon-golf-exact-city-state"
    why: "a reach rule relative to a destination (exact city|state match), not a property of the course"
    what: "Drops golf courses whose city|state is not an exact (case-insensitive) match to the destination; the shared substring fallback is discarded."
    cite: "friendsmoon/src/lib/catalog.ts:259-263@3812b3a"
    quote: ".filter((g) => g.city.toLowerCase() === c && g.state.toLowerCase() === s)"
  - id: "friendsmoon-groupmin-above-party"
    why: "conditional: depends on user input or page"
    what: "In a plan, drops activity/nightlife rows whose groupMin exceeds the headcount."
    cite: "friendsmoon/src/lib/plan.ts:223-225,448,455@3812b3a"
    quote: ".filter((r) => (r.groupMin ?? 0) <= guests)"
soft_fit:
  - id: "friendsmoon-rank-fits-first"
    text: "Rows that hold the whole party (groupMax >= guests) sort first; others remain with their cap shown."
    cite: "friendsmoon/src/lib/plan.ts:228-231@3812b3a"
    quote: "const aFits = (a.groupMax ?? Infinity) >= guests ? 0 : 1;"
  - id: "friendsmoon-whole-unit"
    text: "Whole-unit lodging = not per-room and maxGuests >= guests, cheapest first (crew path premise)."
    cite: "friendsmoon/src/lib/catalog.ts:376-379@3812b3a"
    quote: ".filter((l) => !l.perRoom && l.maxGuests >= guests) .sort((a, b) => a.pricePerNight[0] - b.pricePerNight[0]);"
  - id: "friendsmoon-per-room-couples"
    text: "Per-room stays serve the couples path."
    cite: "friendsmoon/src/lib/catalog.ts:382-385@3812b3a"
    quote: "/** Per-room stays, for the couples path where pairs want their own doors. */"
  - id: "friendsmoon-private-dining"
    text: "Dining rows whose privateDiningSeats hold the whole party rank first."
    cite: "friendsmoon/src/lib/plan.ts:466@3812b3a"
    quote: "(r) => ((r.privateDiningSeats ?? 0) >= input.guests ? 0 : 1),"
  - id: "friendsmoon-golf-tier-label"
    text: "Golf tier enum 'bucket-list' is relabelled 'worth the trip'."
    cite: "friendsmoon/src/lib/brand.ts:226-231@3812b3a"
    quote: "\"bucket-list\": \"worth the trip\","
image_rules:
  - id: "friendsmoon-img-place-not-scene"
    text: "Image queries name the place, never the scene."
    cite: "friendsmoon/BRAND.md:200-202@3812b3a"
    quote: "- **Queries name the PLACE, never the scene.** \"friends long table dinner\" returns eight models laughing at a salad"
  - id: "friendsmoon-img-miss-renders-nothing"
    text: "A cache miss renders nothing: no placeholder, no nearby city's photo; layouts must treat the photo as optional."
    cite: "friendsmoon/BRAND.md:203-205@3812b3a"
    quote: "- **A cache miss renders nothing.** Not a placeholder, not a nearby city's photo. No image beats a wrong one."
  - id: "friendsmoon-img-verify-at-crop"
    text: "Verify subject by looking at pixels at the production crop; 200 OK, filename, photo ID, batch label are not evidence."
    cite: "friendsmoon/BRAND.md:206-209@3812b3a"
    quote: "- **Verify at the production crop.** The same photo at 1600×900 and 400×400 can show different subjects."
  - id: "friendsmoon-img-duotone"
    text: "Photos are graded with a half-strength duotone (greyscale 0.55, plates at 0.55 alpha)."
    cite: "friendsmoon/BRAND.md:183-184,190-191@3812b3a"
    quote: "Real photographs from the shared portfolio cache, graded into the brand by a **half-strength duotone** (2026-08-20; it shipped full-strength first)."
  - id: "friendsmoon-img-own-namespace"
    text: "Image cache is filtered to the friendsmoon/ namespace; other projects' rows are not synced into src/."
    cite: "friendsmoon/BRAND.md:299-300@3812b3a"
    quote: "**Also not scanned into `src/`: other projects' cache rows.** `sync-image-cache.js` filters the shared cache to the `friendsmoon/` namespace."
absent:
  - what: "Any geographic restriction (US-only, domestic, lower 48, etc.)"
    command: "git -C ~/friendsmoon grep -n -i -E 'domestic|US[- ]only|lower 48|continental|geograph' origin/main -- BRAND.md src/lib src/app"
    hits: 0
notes: ["CONTRADICTION (accounts): BRAND.md:306 says 'No Stripe, no accounts, no saved trips.' and src/app/how-it-works/page.tsx:93 says 'There are no accounts and no saved trips', but origin/main ships src/lib/accounts.ts (saved weekends: 'user:{key}:saved HASH', accounts.ts:56), src/app/api/auth/*, src/app/api/saved/route.ts, src/app/login, src/app/my-trips, and AccountLinks.tsx links /my-trips and /login on every page (AccountLinks.tsx:25). Introduced by d9d4b4e (#15); BRAND.md §13 was not updated.", "CONTRADICTION (reassure copy): CTA.reassure 'Free. No account. About two minutes.' (src/lib/brand.ts:109; BRAND.md:258 'is not to be touched') is shown site-wide while sign-in/saved trips exist. Arguably still true (an account is optional), but it co-exists with the false §13 line.", "SECTION-NUMBER DRIFT: code comments cite BRAND.md sections that do not match the file. brand.ts:158 and voice.ts:8 attribute hype/voice rules to 'BRAND.md §2' (§2 is 'The organising idea'; voice is §9 at BRAND.md:211, banned list §12 at :278). brand.ts:145 and catalog.ts:56 attribute the bachelor-party non-ban to 'BRAND.md §8' (§8 is Photography at :181; the rule is §12 at :294). brand.ts:221 says 'bucket-list' is banned by 'BRAND.md §8' (it is HYPE_WORDS / §12).", "TENSION (bachelor vocabulary): BRAND.md:294 says bachelor/bachelorette is 'Deliberately NOT machine-checked', yet catalog.ts:67-68 WRONG_OCCASION machine-checks it on catalog row NAMES (row drop) and voice.ts:120-121 on catalog prose sentences. Reconcilable (BRAND scopes authored copy; catalog.ts:63-64 says 'the rule applies to rows only, never to authored page copy'), but BRAND.md never mentions WRONG_OCCASION.", "BRAND.md:289 bans 'Serif display faces' generally; the code pattern list bans only /\\bfraunces\\b/i (brand.ts:265).", "BRAND.md:312 notes '/nickandvarsha' is a rewrite to a separate noindex personal project excluded from sitemap/robots; not followed (out of scope by brief)."]

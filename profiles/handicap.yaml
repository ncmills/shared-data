# profiles/handicap.yaml — CORPUS-M4 site profile (tagger input). Every rule cites <repo>/<file>:<line>@<sha>;
# anything the repo does not state is ABSENT. hard_excludes → suitability/handicap.json eligible "no" (rules@<blob sha of this file>).
# not_rules = deterministic filters found in the site that are NOT row rules here, with the reason. Read by scripts/corpus/suitability.ts.
site: "handicap"
repo: "handicap-hq"
ref: "75b1463"
shared_data_ref: "dde2cb7"
vocab: "1.0.0"
brand_source:
  cite: "ABSENT"
  note: "No BRAND.md at this sha. Voice is taken from docs/design-system.md (brand essence) and the planner system prompt (VOICE & TONE block)."
  command: "git -C ~/handicap-hq ls-tree -r --name-only origin/main | grep -ci 'brand\\.md'"
  hits: 0
voice:
  summary: "Male-coded ('the boys', 'guys', 'most men' are correct). Camaraderie-first, pilgrimage-minded: warm, confident, a little irreverent, built for a crew that runs the same buddy trip every year. Never corporate, never SaaS-bland, never precious. No exclamation-point spam, no emoji. The voice never overrides data accuracy."
  cite: "handicap-hq/src/lib/planner-prompt.ts:83@75b1463"
  quote: "Handicap HQ is a **camaraderie-first, pilgrimage-minded** golf-trip brand: warm, confident, a little irreverent, built for the crew that's been playing the same buddy trip for years."
  cite_2: "handicap-hq/docs/design-system.md:25-26@75b1463"
  quote_2: "Voice is **male-coded** by design (Nick, 2026-08-17): \"the boys,\" \"guys,\" \"most men\" are correct, not drift."
  banned_words: ["nestled", "boasts", "world-class amenities", "something for everyone", "unforgettable experience", "picturesque", "premier destination", "elevate your", "curated", "indulge"]
  cite_banned: "handicap-hq/src/lib/planner-prompt.ts:91@75b1463"
  quote_banned: "Voice DON'Ts: no \"nestled\", \"boasts\", \"world-class amenities\", \"something for everyone\", \"unforgettable experience\", \"picturesque\", \"premier destination\", \"elevate your\", \"curated\", \"indulge\"."
  enforced_scrub:
    text: "Deterministic post-generation scrub (skips name/url/id keys) replaces this list in plan prose; it is the list the code actually enforces."
    terms: ["something for everyone", "world-class", "premium", "trusted", "cutting-edge", "nestled", "boasts", "picturesque", "curated", "elevate", "indulge"]
    cite: "handicap-hq/src/lib/scrub-voice.ts:37-53@75b1463"
    quote: "[/\\bsomething for everyone\\b/gi, \"plenty to choose from\"], [/\\bworld-class\\b/gi, \"standout\"], [/\\bpremium\\b/gi, \"top-shelf\"],"
  free_preview_wrap:
    text: "Free-preview cards (no LLM) re-register shared-data tagline/description strings with a fixed cliche swap list."
    terms: ["a hidden gem", "an hidden gem", "hidden gem", "off the beaten path", "something for everyone", "world-class", "world class", "picturesque", "breathtaking", "stunning", "nestled", "boasts", "boast", "premier", "luxurious", "vibrant", "bustling"]
    cite: "handicap-hq/src/lib/hhq-voice.ts:24-40@75b1463"
    quote: "{ re: /\\ban?\\s+hidden gem\\b/gi, to: \"an under-the-radar gem\" },"
audience:
  summary: "A crew of male golf buddies (8 to 24) who run an annual golf trip together; the handicap is the equalizer that keeps the trip fair across skill levels."
  cite: "handicap-hq/docs/design-system.md:23-26@75b1463"
  quote: "the equalizer that makes the buddy trip fair*, from eight golfers to a crew of 24 (the range enforced by `lib/validate.ts` — copy must not claim more). Voice is **male-coded** by design"
group_size:
  min: 8
  max: 24
  cite: "handicap-hq/src/lib/validate.ts:32@75b1463"
  quote: "const groupSize = clampInt(s.groupSize, 8, 24, 12);"
  input_handling:
    text: "Out-of-range values are clamped, not rejected; default 12. Non-number input falls back to 12."
    cite: "handicap-hq/src/lib/validate.ts:188-191@75b1463"
    quote: "const n = typeof val === \"number\" ? Math.round(val) : fallback; return Math.max(min, Math.min(max, n));"
  days:
    min: 2
    max: 7
    default: 3
    cite: "handicap-hq/src/lib/validate.ts:31@75b1463"
    quote: "const numberOfDays = clampInt(s.numberOfDays, 2, 7, 3);"
product:
  summary: "An AI golf-trip planner (wizard -> 1 to 3 tier plans built only from the shared-data destination catalog). Planner only: no merch shop, no Stripe, no Printful, no paid concierge."
  cite: "handicap-hq/docs/design-system.md:22@75b1463"
  quote: "Handicap HQ is a **golf-trip planner**, not a party brand — the sibling site to"
  cite_2: "handicap-hq/CLAUDE.md:48-49@75b1463"
  quote_2: "Handicap HQ is a golf-trip **planner** — it has NO merch shop, NO Stripe, NO Printful, and NO paid concierge."
geography:
  summary: "US states grouped into 8 data regions, plus an 'International' region whose selectable values are country names. Validation accepts US 2-letter state codes or country names such as Scotland/Ireland. The International chip list is wider than Scotland/Ireland."
  allow: ["Southwest", "Pacific NW", "Mountain West", "Midwest", "Southeast", "Northeast", "South Central", "California", "International"]
  allow_international: ["Bahamas", "Dominican Republic", "Ireland", "Mexico", "Northern Ireland", "Portugal", "Scotland", "Spain"]
  cite: "handicap-hq/src/data/regions.ts:18-40@75b1463"
  quote: "\"International\": [\"Bahamas\", \"Dominican Republic\", \"Ireland\", \"Mexico\", \"Northern Ireland\", \"Portugal\", \"Scotland\", \"Spain\"],"
  cite_2: "handicap-hq/src/lib/validate.ts:38-41@75b1463"
  quote_2: "// Region mode carries US 2-letter state codes OR (for the \"International\" region) country names // like \"Scotland\"/\"Ireland\" — so allow up to 40 chars and only uppercase true 2-letter US codes;"
content_rules:
  - id: "handicap-male-coded"
    text: "Male-coded voice is intended; 'the boys', 'guys', 'most men' are not drift."
    cite: "handicap-hq/docs/design-system.md:25-26@75b1463"
    quote: "Voice is **male-coded** by design (Nick, 2026-08-17): \"the boys,\" \"guys,\" \"most men\" are correct, not drift."
  - id: "handicap-group-claim-cap"
    text: "Copy must not claim a group range beyond 8 to 24."
    cite: "handicap-hq/docs/design-system.md:24-25@75b1463"
    quote: "from eight golfers to a crew of 24 (the range enforced by `lib/validate.ts` — copy must not claim more)."
  - id: "handicap-never-corporate"
    text: "Never corporate, never SaaS-bland, never precious; home base, not a travel brochure."
    cite: "handicap-hq/src/lib/planner-prompt.ts:83@75b1463"
    quote: "It's the home base — the group text, the shared house, the scorecard everyone argues about — not a travel brochure. NEVER corporate, NEVER SaaS-bland, NEVER precious."
  - id: "handicap-no-exclaim-no-emoji"
    text: "No exclamation-point spam, no emoji."
    cite: "handicap-hq/src/lib/planner-prompt.ts:91@75b1463"
    quote: "No exclamation-point spam. No emoji."
  - id: "handicap-voice-not-over-data"
    text: "Voice lives in prose around facts; venue names, prices, URLs and round counts stay exact; never invent a venue or stat."
    cite: "handicap-hq/src/lib/planner-prompt.ts:93@75b1463"
    quote: "Voice does NOT override DATA ACCURACY below: venue names, prices, URLs, and round counts stay EXACT and real."
  - id: "handicap-db-only-venues"
    text: "The destination database is the only venue source; no invented or cross-city venues."
    cite: "handicap-hq/src/lib/planner-prompt.ts:97@75b1463"
    quote: "**The destination database below is the ONLY venue source for this plan. No exceptions.**"
  - id: "handicap-full-golf-day"
    text: "Crew arrives the night before Day 1; every numbered day is a full golf day, no travel day."
    cite: "handicap-hq/src/lib/planner-prompt.ts:38@75b1463"
    quote: "EVERY numbered Day (Day 1 through the last) is then a FULL GOLF DAY — do not burn a day on travel/arrival."
  - id: "handicap-course-drive-time"
    text: "Courses within 30-45 min of lodging, never more than 1 hour (prompt-only; see notes)."
    cite: "handicap-hq/src/lib/planner-prompt.ts:45@75b1463"
    quote: "- Courses must be within 30–45 min of lodging (NEVER more than 1 hour)"
  - id: "handicap-tee-times"
    text: "AM tee times 8:30-9:30 (never before 8:00); PM 2:00-3:00."
    cite: "handicap-hq/src/lib/planner-prompt.ts:43-44@75b1463"
    quote: "- AM tee times: 8:30–9:30 AM (never before 8:00) - PM tee times: 2:00–3:00 PM (leave time for lunch between rounds)"
  - id: "handicap-exact-round-count"
    text: "Total rounds = numberOfDays x roundsPerDay (1 if 'One (18)', else 2), injected as a mandatory exact number."
    cite: "handicap-hq/src/lib/planner-prompt.ts:274-277@75b1463"
    quote: "const golfDays = Math.max(state.numberOfDays, 1); const roundsPerDayNum = state.roundsPerDay === \"One (18)\" ? 1 : 2; const totalRounds = golfDays * roundsPerDayNum;"
  - id: "handicap-three-tiers"
    text: "Plans use three named tiers: The Weekender (budget), The Pilgrimage (recommended), The Bucket List (luxury); 1 to 3 are generated per request."
    cite: "handicap-hq/src/lib/planner-prompt.ts:152@75b1463"
    quote: "\"tierName\": \"string — 'The Weekender', 'The Pilgrimage', or 'The Bucket List'\","
  - id: "handicap-tier-price-separation"
    text: "Weekender 25-40% cheaper than Pilgrimage; Bucket List 30-60% more expensive."
    cite: "handicap-hq/src/lib/planner-prompt.ts:136@75b1463"
    quote: "The Weekender should be 25-40% cheaper than The Pilgrimage, and The Bucket List should be 30-60% more expensive than The Pilgrimage."
  - id: "handicap-no-lodging-url"
    text: "Never include a URL for lodging."
    cite: "handicap-hq/src/lib/planner-prompt.ts:115@75b1463"
    quote: "- **Lodging**: NEVER include a `url` for lodging — pricing is estimated; we do not link to specific listings. Describe the area so users know what to search."
  - id: "handicap-no-cross-tier-repeats"
    text: "Each tier uses distinct lodging, primary dining and primary bars."
    cite: "handicap-hq/src/lib/planner-prompt.ts:118@75b1463"
    quote: "When generating all three tiers for the same destination, each tier must use distinct venues for lodging, the primary dining spots, and the primary bars."
  - id: "handicap-no-commerce"
    text: "No merch shop, Stripe, Printful, checkout or paid concierge; any reappearance is a regression."
    cite: "handicap-hq/CLAUDE.md:48-52@75b1463"
    quote: "If you find any Stripe/ Printful/checkout/shop route reappearing, it's a regression — remove it."
  - id: "handicap-no-old-brand-voice"
    text: "Do not reintroduce the retired dark/neon/devil theme or its 'Hell is empty' voice."
    cite: "handicap-hq/docs/design-system.md:214-215@75b1463"
    quote: "- ❌ Reintroduce the old brand's dark/neon theme, devil trident mark, or \"Hell is empty, all the devils are here\" voice — that brand is retired to the personal site (tourdefore.com)."
  - id: "handicap-headings-sentence-case"
    text: "Headings are sentence-case, never uppercase-transformed."
    cite: "handicap-hq/docs/design-system.md:144@75b1463"
    quote: "- Headings are sentence-case, never `text-transform: uppercase`."
hard_excludes: []
not_rules:
  - id: "handicap-region-filter"
    why: "conditional: depends on user input or page"
    what: "Region mode: destinations whose region differs from the chosen wizard region are dropped (only when the label is a valid region)."
    cite: "handicap-hq/src/data/query.ts:308-313@75b1463"
    quote: "if (options.region) { const region = regionLabelToRegion(options.region); if (region) { results = results.filter((d) => d.region === region); } }"
  - id: "handicap-state-narrowing"
    why: "conditional: depends on user input or page"
    what: "Region mode with state chips: destinations whose state is not in the user's states[] are dropped, unless that would leave zero."
    cite: "handicap-hq/src/data/query.ts:317-321@75b1463"
    quote: "if (options.states && options.states.length > 0) { const allow = new Set(options.states.map((s) => s.toUpperCase())); const narrowed = results.filter((d) => allow.has(d.state.toUpperCase()));"
  - id: "handicap-specific-city"
    why: "conditional: depends on user input or page"
    what: "Specific-destination mode: only destinations matching the typed place survive (exact id, then city/'City, ST'/state substring, then city token, then full state name); no match returns empty (400), never a substitute."
    cite: "handicap-hq/src/data/query.ts:243-305@75b1463"
    quote: "// 4) Nothing resolved — reject rather than substitute. return [];"
  - id: "handicap-group-size-lodging"
    why: "conditional: depends on user input or page"
    what: "Destinations with no lodging row whose max sleeps >= groupSize are dropped. groupSize is always present (clamped 8-24, default 12), so this runs on every wizard pick, but the cut depends on the input value."
    cite: "handicap-hq/src/data/query.ts:330-334@75b1463"
    quote: "if (options.groupSize) { results = results.filter((d) => d.lodging.some((l) => options.groupSize! <= l.sleeps[1]) ); }"
  - id: "handicap-activity-filter"
    why: "conditional: depends on user input or page"
    what: "When the user picks activities, destinations with none of the mapped activity types are dropped, unless that leaves zero."
    cite: "handicap-hq/src/data/query.ts:337-350@75b1463"
    quote: "const withActivities = results.filter((d) => requestedTypes.some((type) => d.activities.some((a) => a.type === type) ) ); if (withActivities.length > 0) results = withActivities;"
  - id: "handicap-bachelor-page-filter"
    why: "conditional: depends on user input or page"
    what: "Destinations with fewer than 3 bars or population 'tiny' get no /golf-trips/[slug]/bachelor-party page and no bachelor sitemap entry."
    cite: "handicap-hq/src/app/golf-trips/[slug]/bachelor-party/page.tsx:14-17@75b1463"
    quote: "// Only generate for destinations with 3+ bars const bachelorDests = allDestinations.filter( (d) => d.bars.length >= 3 && d.population !== \"tiny\" );"
  - id: "handicap-month-in-season"
    why: "conditional: depends on user input or page"
    what: "Best-golf-trips-by-month pages drop destinations whose month-fit score is below 60 (climate curve by region/country + bestSeasons nudge)."
    cite: "handicap-hq/src/data/seasonality.ts:102,117@75b1463"
    quote: "export const IN_SEASON_THRESHOLD = 60; ... .filter((r) => r.score >= IN_SEASON_THRESHOLD)"
  - id: "handicap-exclusion-backstop"
    why: "conditional: depends on user input or page"
    what: "Generated-plan rows matching the user's negation tokens (plus synonyms) are removed: dining (swap or drop), bars (drop), non-golf schedule items (drop). Courses and lodging are swap-only, never dropped."
    cite: "handicap-hq/src/lib/enforce-exclusions.ts:98-124@75b1463"
    quote: "plan.bars = plan.bars.filter((b) => !matches(b?.name, b?.vibe));"
soft_fit:
  - id: "handicap-season-soft"
    text: "Season is deliberately not a hard filter; off-season cities are deprioritised by scoring only."
    cite: "handicap-hq/src/data/query.ts:323-327@75b1463"
    quote: "// Season: intentionally NOT a hard filter. Off-season cities stay visible;"
  - id: "handicap-course-quality-scoring"
    text: "courseQuality maps to preferred course tiers, used for scoring (capped at 3 matches), not dropping."
    cite: "handicap-hq/src/data/query.ts:179-186,467-470@75b1463"
    quote: "case \"Cheap & fun\": return [\"budget\", \"solid\"]; case \"Mix of public & resort\": return [\"solid\", \"premium\"]; case \"Bucket list only\": return [\"bucket-list\", \"premium\"];"
  - id: "handicap-group-sweet-spot"
    text: "12-16 is the sweet spot for group size."
    cite: "handicap-hq/src/lib/planner-prompt.ts:51@75b1463"
    quote: "- 12–16 is the sweet spot for group size"
  - id: "handicap-rental-house"
    text: "One big rental house beats a hotel."
    cite: "handicap-hq/src/lib/planner-prompt.ts:34@75b1463"
    quote: "- One big rental house is ALWAYS better than a hotel — it's HQ, the hangout, the home base"
  - id: "handicap-walkable-nightlife"
    text: "Walkable downtown nightlife proximity matters."
    cite: "handicap-hq/src/lib/planner-prompt.ts:36@75b1463"
    quote: "- Downtown/walkable nightlife proximity matters — nobody wants to Uber 30 min after beers"
  - id: "handicap-course-mix"
    text: "Mix course difficulty: one bucket-list/premium, one mid-tier, one casual."
    cite: "handicap-hq/src/lib/planner-prompt.ts:48@75b1463"
    quote: "- Mix course difficulty: one bucket-list/premium course, one mid-tier, one casual/fun track"
  - id: "handicap-steakhouse-final"
    text: "Final night is the big steakhouse dinner; private chef at least one night."
    cite: "handicap-hq/src/lib/planner-prompt.ts:35,40@75b1463"
    quote: "- Final night should be the big steakhouse dinner"
  - id: "handicap-budget-heuristic"
    text: "$800-$1,500/person for a 3-day trip is the realistic range."
    cite: "handicap-hq/src/lib/planner-prompt.ts:59@75b1463"
    quote: "- $800–$1,500/person for a 3-day trip is the realistic range"
  - id: "handicap-regional-diversity"
    text: "With no region chosen, smaller regions get a diversity bonus and picks spread across regions."
    cite: "handicap-hq/src/data/query.ts:757-761@75b1463"
    quote: "// ── Regional diversity bonus (when no region specified) ──"
image_rules:
  - id: "handicap-no-navy-gold"
    text: "No navy + gold primary pair and no #008854-family fairway green; executable-gated by npm run taste."
    cite: "handicap-hq/docs/design-system.md:217-218@75b1463"
    quote: "- ❌ Use the saturated `#008854`-family fairway green, or pair navy + gold as a primary combo — both are executable-gated by `npm run taste`."
  - id: "handicap-never-country-club"
    text: "Never corporate golf cliche (navy + gold country-club, saturated fairway green); feels like a yardage book / editorial travel map."
    cite: "handicap-hq/docs/design-system.md:38-39@75b1463"
    quote: "scorecard. **Never:** corporate golf cliché (navy + gold country-club, saturated fairway green) ·"
  - id: "handicap-contour-placeholder"
    text: "YardageCard shows ContourTexture behind the photo as a branded placeholder so a card never falls to a flat block."
    cite: "handicap-hq/docs/design-system.md:161@75b1463"
    quote: "`ContourTexture` sits behind the photo as a branded placeholder so a card never falls back to a flat block on slow/missing images."
  - id: "handicap-contour-opacity"
    text: "ContourTexture opacity stays low, about 0.04-0.08."
    cite: "handicap-hq/docs/design-system.md:163-165@75b1463"
    quote: "texture behind hero sections and card placeholders — keep its opacity low (≈0.04–0.08); pushed higher it reads busy against body copy."
  - id: "handicap-no-legacy-raster"
    text: "Do not reuse retired raster marks (devil/trident, 'TOUR DE FORE · EST. 2021')."
    cite: "handicap-hq/docs/design-system.md:76-78@75b1463"
    quote: "**Legacy assets — do not use:** the old raster marks (`/logo-full.webp`, `/logo.webp`, `/logo-est2021.webp`, devil/trident art) with \"TOUR DE FORE · EST. 2021\" baked into the pixels are"
  - id: "handicap-clay-sole-accent"
    text: "Clay #A6552E is the only accent; no second brand color."
    cite: "handicap-hq/docs/design-system.md:108@75b1463"
    quote: "- **Clay `#A6552E` is the only accent.** No blue, no purple, no second \"brand\" color."
  - id: "handicap-image-search"
    text: "Plan emits an imageSearch string on lodging, each course and each dining entry."
    cite: "handicap-hq/src/lib/planner-prompt.ts:148@75b1463"
    quote: "Include an `imageSearch` field on lodging, each course, and each dining entry — a search-engine-friendly string for finding a representative photo"
absent:
  - what: "BRAND.md (any path)"
    command: "git -C ~/handicap-hq ls-tree -r --name-only origin/main | grep -ci 'brand\\.md'"
    hits: 0
  - what: "'camaraderie' in docs/design-system.md (hhq-voice.ts attributes the camaraderie-first register to that doc)"
    command: "git -C ~/handicap-hq grep -c -i 'camaraderie' origin/main -- docs/design-system.md"
    hits: 0
  - what: "'precious' in docs/design-system.md"
    command: "git -C ~/handicap-hq grep -n -i 'precious' origin/main -- docs/design-system.md"
    hits: 0
  - what: "Any unconditional, site-level filter on allDestinations inside src/data or src/lib (site tagging of golfDestinations() lives in the shared-data package, not here)"
    command: "git -C ~/handicap-hq grep -nE 'allDestinations\\.(filter|slice)' origin/main -- src/data src/lib ':!*.test.ts'"
    hits: 0
    note: "every allDestinations.filter at this sha is in src/app page routes and is path-scoped"
  - what: "stewards/wizard-profiles/handicaphq.json (cited by scrub-voice.ts as the banned-word source)"
    command: "git -C ~/handicap-hq ls-tree -r --name-only origin/main | grep -c stewards"
    hits: 0
  - what: "src/data/destinations-*.ts (golf-atlas.ts says to verify against them)"
    command: "git -C ~/handicap-hq ls-tree -r --name-only origin/main -- src/data | grep -c 'destinations-'"
    hits: 0
notes: ["Logo contradiction inside design-system.md: §2 says the mark is 'The Summit' (flag on a ridge) and the compass-star roundel was replaced, but line 74 still says 'so the compass mark travels with it' and line 221 says 'The live mark is the compass-star <Logo>'. Cites: handicap-hq/docs/design-system.md:46-48,74,220-221@75b1463.", "Geography: the system prompt says 'You plan legendary group golf trips across America' (planner-prompt.ts:29) while regions.ts:39 offers 8 International countries and validate.ts:38-41 accepts country names.", "Tier count: the prompt describes three tiers ('Note: 3 full tier plans', planner-prompt.ts:27, 128-133) but planCountFor returns 1-3 plans (planner-prompt.ts:22-24); a specific city + narrow budget yields one plan.", "Rounds: prompt says '108 holes in 3 days is the gold standard (36 holes/day, 2 rounds)' (planner-prompt.ts:32) but the wizard accepts roundsPerDay 'One (18)' and the exact-count injection honours it (planner-prompt.ts:275).", "Voice provenance: hhq-voice.ts:11-13 says 'camaraderie-first, never precious, per docs/design-system.md'; design-system.md has 0 hits for either word. The phrase lives in planner-prompt.ts:83.", "Two deterministic voice scrubbers disagree on replacements: hhq-voice.ts:29 world-class -> 'world-beating', scrub-voice.ts:41 world-class -> 'standout'. And the prompt ban list (planner-prompt.ts:91) is narrower than the scrub list (scrub-voice.ts:37-53: adds premium, trusted, cutting-edge, bare world-class, bare elevate).", "Drive time: the 30-45 min / never >1 hour rule is prompt-only (planner-prompt.ts:45); buildDestinationContext emits every course with its driveMinutes and no filter (query.ts:1052-1057).", "Group size: groupSize max is 24 (validate.ts:32) but attendees are capped at 20 (validate.ts:179); the prompt suggests a treasurer for 'groups of 6+' (planner-prompt.ts:56), below the 8 minimum.", "Site tag: src/data/index.ts:5-6 says the destinations are 'tagged sites:[tdf]' in shared-data; the site key there is tdf, not handicap. The filter itself is in shared-data and was not read (brief: do not borrow from sibling repos).", "Not listed as a hard_exclude (it drops LLM output, not catalog rows): the venue guard drops any generated course/dining/bar whose name does not fuzzy-match this destination's DB rows, unconditionally on every generation. Cite handicap-hq/src/app/api/generate-plan/route.ts:759-792@75b1463, quote: 'console.warn(`[venue-guard] dropped out-of-DB course \"${course.name}\" from ${pick.destination.id}`);'", "design-system.md:15-16 and CLAUDE.md:12-13 both mark docs/design-system.html as superseded (retired dark/neon brand); it was not used."]

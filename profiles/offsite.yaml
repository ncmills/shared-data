# anything the repo does not state is ABSENT. hard_excludes → suitability/offsite.json eligible "no" (rules@<blob sha of this file>).
# not_rules = deterministic filters found in the site that are NOT row rules here, with the reason. Read by scripts/corpus/suitability.ts.
site: "offsite"
repo: "offsite-outpost"
ref: "36437de"
shared_data_ref: "dde2cb7"
vocab: "1.0.0"
brand_source:
  cite: "offsite-outpost/BRAND.md@36437de"
voice:
  summary: "Verdict-first, editorial, confident-understated; white-glove, bespoke, concierge-grade. No SKU / off-the-shelf / headcount-gate language, no AI slop, no over-promising. Imply the superlative through specificity, never boast it."
  cite: "offsite-outpost/BRAND.md:20@36437de"
  quote: "- Voice: verdict-first, editorial, confident-understated. No SKU/\"buy off the shelf\"/headcount-gate language. No AI slop, no over-promising."
  banned_words: ["a few we've designed", "clients trust us", "past-tense delivery claims", "testimonials", "customer logos", "counts of events run", "ratings", "SKU", "buy off the shelf", "headcount-gate language", "for teams of 50–500"]
  cite_banned: "offsite-outpost/BRAND.md:35@36437de"
  quote_banned: "**Banned in all copy:** past-tense delivery claims (\"a few we've designed\", \"clients trust us\"), testimonials, customer logos, counts of events run, ratings."
audience:
  summary: "Corporate buyers, split by product: Retreat = HR / People (people/culture register); Outing = client-facing / Sales (deal register). The two registers must not cross. Outing input audience is 'internal' | 'clients'."
  cite: "offsite-outpost/BRAND.md:28-33@36437de"
  quote: "**Two payoffs, split by buyer.** The registers must not cross — that mapping is load-bearing (see the wizard audience tailoring, 2026-07-20):"
group_size:
  min: 1
  max: 500
  cite: "offsite-outpost/src/app/api/generate/route.ts:117@36437de"
  quote: "const headcount = Math.max(1, Math.min(500, Number(body.headcount) || 100));"
product:
  summary: "Two wizards: multi-day corporate retreats and single-day client/team outings ('Extraordinary corporate outings — any type, any size'). The free AI wizard produces a bespoke draft; a human concierge (dedicated producer, single invoice, guests never see a charge) makes it real."
  cite: "offsite-outpost/BRAND.md:15@36437de"
  quote: "**Promise:** Extraordinary corporate outings — **any type, any size** — crafted to the last detail."
geography:
  summary: "Worldwide (retreat atlas includes non-US venues). No country allow/deny list. Soft domestic bias: a US-origin team gets +3 for USA venues and +4 more for same-region venues. Outings anchor to a US city (212 shared-data party cities, golf-town fallback) or a marquee US city when flown."
  allow: ["Worldwide"]
  cite: "offsite-outpost/src/lib/brand.ts:22@36437de"
  quote: "coords: \"By invitation · Worldwide\","
content_rules:
  - id: "offsite-registers-never-cross"
    text: "Retreat copy speaks the People/culture register (team comes home changed); Outing copy speaks the deal register (client's best day, one invoice). Never mix them."
    cite: "offsite-outpost/BRAND.md:28-33@36437de"
    quote: "| Outing | Client-facing / Sales | Your client's best day of the year; the day the relationship is won; one invoice, guests never see a charge. Deal register. |"
  - id: "offsite-no-track-record-claims"
    text: "No past-tense delivery claims, testimonials, customer logos, counts of events run, or ratings — there is no delivered track record yet."
    cite: "offsite-outpost/BRAND.md:35@36437de"
    quote: "There is no delivered track record yet, and inventing one is out of bounds. Proof comes from the specificity and craft of the artifact instead."
  - id: "offsite-any-size-is-concierge-only"
    text: "'Any type / any size' attaches to the human concierge's flexibility; never imply the wizard fabricates unsourced venues."
    cite: "offsite-outpost/BRAND.md:19@36437de"
    quote: "- **Honesty guard:** \"any type / any size\" attaches to the human concierge's flexibility, never implies the wizard fabricates unsourced venues."
  - id: "offsite-not-a-sku-catalog"
    text: "Not a SKU catalog and not 'for teams of 50–500'."
    cite: "offsite-outpost/BRAND.md:17@36437de"
    quote: "- White-glove, bespoke, concierge-grade. Not a SKU catalog, not \"for teams of 50–500.\""
  - id: "offsite-concierge-single-invoice"
    text: "Free wizard gives a bespoke draft; the concierge (dedicated producer, single invoice, guests never see a charge) makes it real."
    cite: "offsite-outpost/BRAND.md:18@36437de"
    quote: "- The free AI wizard is the fastest path to a **bespoke draft**; the **concierge** (a dedicated producer, single invoice, guests never see a charge) makes it real."
  - id: "offsite-speed-price-not-the-promise"
    text: "Speed and price are friction-removers, not the promise; 'Free · no signup · about two minutes' never appears in an H1, primary CTA or header."
    cite: "offsite-outpost/BRAND.md:24@36437de"
    quote: "\"Free · no signup · about two minutes\" earns exactly one quiet line under the hero CTA and one card in the offerings directory; it never appears in an H1, a primary CTA, or the header."
  - id: "offsite-superlative-through-specificity"
    text: "Imply the superlative through craft and real named atlas records, never boast it."
    cite: "offsite-outpost/BRAND.md:26@36437de"
    quote: "**Imply the superlative through craft, never boast it.** Specificity carries the awe."

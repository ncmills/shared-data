notes: ["The four unconditional overlay filters execute in the pinned dependency shared-data@86e2a78 (offsite-outpost/package.json:30@36437de). Upstream cites: shared-data/src/destinations-overlay.ts:163-189@86e2a78 (keepAud = audiences.includes(\"corporate\") for activities/nightlife/dining; forWizard(\"offsite-outing\") for lodging/transport); shared-data/src/tags.ts:170-186@86e2a78 (ACTIVITY_AUDIENCE_TAGS, the 11 party-locked types); shared-data/src/tags.ts:221-222@86e2a78 (vibe === \"unhinged\"); shared-data/src/destinations-bake.ts:116,156-158@86e2a78 (activity audiences from type; dining all-audience).", "shared-data/src/destinations-bake.ts:52-77@86e2a78 TAG_OVERRIDES adds 'offsite-outing' to the wizards tag of some nightlife rows (e.g. Harrah's New Orleans Casino), but applyOutpostOverlay filters nightlife by audiences, not wizards, so those overrides do not change OO nightlife; they do affect lodging/transport (e.g. Myrtle Beach Party Bus).", "CONTRADICTION: 'any size' (BRAND.md:15) and 'not for teams of 50–500' (BRAND.md:17) vs. the API clamping headcount to 1–500 (src/app/api/generate/route.ts:117). BRAND.md:19 partly reconciles it (any size = concierge, not wizard).", "CONTRADICTION: BRAND.md:5 says 'Fraunces editorial serif' and BRAND.md:116 says 'Stat (Fraunces number + mono label)', while BRAND.md:74,79 say display is Inter Tight and Fraunces was dropped in 2ba8577.", "Stale comment: src/data/image-subject-denylist.ts:104 says 'These two are a different failure' but after the 2026-08-20 retirement (:108) only one venues/* entry (schloss-elmau, :114) remains."]

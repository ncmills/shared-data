# profiles/moh.yaml — CORPUS-M4 site profile (tagger input). Every rule cites <repo>/<file>:<line>@<sha>;
# anything the repo does not state is ABSENT. hard_excludes → suitability/moh.json eligible "no" (rules@<blob sha of this file>).
# not_rules = deterministic filters found in the site that are NOT row rules here, with the reason. Read by scripts/corpus/suitability.ts.
site: "moh"
repo: "maid-of-honor-hq"
ref: "1bcdb7a"
shared_data_ref: "dde2cb7"
vocab: "1.0.0"
brand_source:
  cite: "maid-of-honor-hq/BRAND.md@1bcdb7a"
voice:
  summary: "Cup of Jo / The Cut / editorial-feminine: a personal travel column by the friend who has been; warm, observant, a little wry, specific, never sparkly filler; 'warm, stylish friend'; bride-centered."
  cite: "maid-of-honor-hq/BRAND.md:89-95@1bcdb7a"
  quote: "**Cup of Jo / The Cut / editorial-feminine.** The canon voice for Maid of"
  banned_words: ["crew", "squad", "send-it", "babe", "bride tribe", "world-class", "premium", "trusted", "cutting-edge"]
  cite_banned: "maid-of-honor-hq/BRAND.md:107-108@1bcdb7a"
  quote_banned: "- `crew`, `squad`, `send-it`, `babe`, `bride tribe` (all BESTMAN voice — never port)"
audience:
  summary: "The maid of honor / bridesmaids planning a bachelorette weekend; the bride is the honoree, bridesmaids are the audience/executors."
  cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:1097@1bcdb7a"
  quote: "- The bride is the honoree; the bridesmaids are the audience/executors. Copy should reflect that relationship."
group_size:
  min: 2
  max: 30
  cite: "maid-of-honor-hq/src/lib/validate.ts:122@1bcdb7a"
  quote: "const groupSize = clampInt(s.groupSize, 2, 30, 12);"
product:
  summary: "Editorial atlas of US bachelorette weekends plus an AI wizard that customizes a plan for the bridesmaids."
  cite: "maid-of-honor-hq/src/lib/site-config.ts:29@1bcdb7a"
  quote: "\"An editorial atlas of US bachelorette weekends . Pick one, customize it for the bridesmaids, every reservation pre-filled.\","
geography:
  summary: "Auto-planner destination catalog is US-only; shared-data destinations with region 'international' are filtered out. (The atlas separately carries international feral trips — see notes.)"
  allow: ["US"]
  cite: "maid-of-honor-hq/src/data/index.ts:20-27@1bcdb7a"
  quote: "// MOH is a US-only bachelorette catalog. `shared-data` is the cross-project"
content_rules:
  - id: "moh-no-golf-build-gate"
    text: "Prebuild gate (not a filter): fails the build if any allDestinations activity has type === 'golf'. Complete matcher: `for (const d of allDestinations) for (const a of (d.activities ?? [])) if (a.type === \"golf\") leaks.push(...)`; exits 1 on any leak. Scans only allDestinations[].activities[].type (exact string equality, no name/highlight match). Wired as the last step of package.json prebuild."
    cite: "maid-of-honor-hq/scripts/check-no-golf.ts:14-16@1bcdb7a"
    quote: "    if (a.type === \"golf\") leaks.push(`${d.id}/${a.name ?? \"?\"}`);"
  - id: "moh-no-golf-prebuild-wiring"
    text: "prebuild runs build-destination-stubs, sync-image-cache, check-brand-drift, check-parity, check-data-schema, check-no-golf in that order."
    cite: "maid-of-honor-hq/package.json:14@1bcdb7a"
    quote: "npx tsx scripts/check-data-schema.ts && npx tsx scripts/check-no-golf.ts\","
  - id: "moh-brand-drift-gate"
    text: "Prebuild lint fails on BMHQ/Proposalmoon-coded terms in src/ and scripts/ (outside allow-listed files/lines): /\\bcrew\\b/gi, /\\bsend-it\\b/gi, /\\bsend-off\\b/gi, /\\bthe guys\\b/gi, /\\bthe boys\\b/gi, /\\bno survivors\\b/gi, /\\bbest man\\b/gi, /\\bbestman\\b/gi, /\\bgroomsm[ae]n\\b/gi, /\\bengagedmoon\\b/gi, /\\bproposalmoon\\b/gi."
    cite: "maid-of-honor-hq/scripts/check-brand-drift.ts:26-47@1bcdb7a"
    quote: "  { pattern: /\\bcrew\\b/gi, reason: \"BMHQ-coded: crew\" },"
  - id: "moh-prompt-banned-phrases"
    text: "Generation prompt bans: crew, squad, send-it, send-off, legend, bachelor, groom, the guys, the boys, no survivors; world-class, premium, trusted, cutting-edge; Last Supper, Last Encore, Last Float, Last Birdie, Back Nine, Last Bash."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:1101-1103@1bcdb7a"
    quote: "- Bachelor-coded terms: \"crew\", \"squad\", \"send-it\", \"send-off\" (as a noun phrase), \"legend\", \"bachelor\", \"groom\", \"the guys\", \"the boys\", \"no survivors\""
  - id: "moh-group-address"
    text: "Refer to the group as the bridesmaids / the girls / her bridal party / her inner circle / the group chat / her bridesmaids; never the crew, the squad, the guys, the boys, the group."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:1095@1bcdb7a"
    quote: "- Refer to the group as \"the bridesmaids\", \"the girls\", \"her bridal party\", \"her inner circle\", \"the group chat\", or \"her bridesmaids\" — NEVER \"the crew\", \"the squad\", \"the guys\", \"the boys\", \"the group\" (too generic)."
  - id: "moh-scrub-voice"
    text: "Deterministic post-generation rewrite of plan prose: world-class->standout, premium->elevated, trusted->go-to, cutting-edge->modern, 'the whole crew/squad'->everyone, crew's/squad's->bridesmaids', crew(s)/squad(s)->bridesmaids. Skips keys priceLevel, id, slug, url, image, imageSearch, imageUrl, address."
    cite: "maid-of-honor-hq/src/lib/scrub-voice.ts:38-56@1bcdb7a"
    quote: "  [/\\b(?:crew|squad)s?\\b/gi, \"bridesmaids\"],"
  - id: "moh-refine-foreign-place-scrub"
    text: "Refine 'unmet.fix' text naming a non-US place is replaced wholesale with a US-only message. Regex is \\b(<tokens, spaces as \\s+>)\\b, flag i. Full token list: cancun, cabo, cabo san lucas, tulum, mexico, mexican, caribbean, bahamas, jamaica, punta cana, dominican, puerto vallarta, los cabos, cozumel, paris, europe, european, costa rica, bali, canada, montreal, toronto, tokyo, london. Applies to refine fix strings, not catalog rows."
    cite: "maid-of-honor-hq/src/lib/refine-plan.ts:183-192@1bcdb7a"
    quote: "  \"puerto vallarta\", \"los cabos\", \"cozumel\", \"paris\", \"europe\", \"european\","
  - id: "moh-wizard-international-blocked"
    text: "Wizard cannot advance with region 'International'; it hands off to /region/international (atlas). International is not offered as a picker region."
    cite: "maid-of-honor-hq/src/components/PartyWizardClient.tsx:1110@1bcdb7a"
    quote: "          if (regionFilter === \"International\") return false;"
  - id: "moh-feral-no-invent"
    text: "Feral-trip generator prompt: name real inns/chefs/instructors; if no real name is known, skip the slot — do not invent generic placeholders."
    cite: "maid-of-honor-hq/scripts/generate-feral-extend.ts:195@1bcdb7a"
    quote: "- Specificity is everything. Name the inn. Name the chef. Name the yoga instructor if you know one. If you don't know a real name, SKIP that slot or pick a different seed — DO NOT invent"
  - id: "moh-feral-us-only"
    text: "Feral-trip generator prompt: every trip is US-only (50 states)."
    cite: "maid-of-honor-hq/scripts/generate-feral-extend.ts:198@1bcdb7a"
    quote: "- Every trip is US-only (50 states). Never suggest international."
  - id: "moh-no-invented-social-proof"
    text: "Prompt: no invented ratings/numeric social proof; omit if the data record has none."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:1403@1bcdb7a"
    quote: "- Do NOT invent social-proof numbers. If the data record has no rating, omit it entirely."
hard_excludes:
  - id: "moh-golf"
    text: "Golf is never Maid of Honor HQ: every golf course, and every activity typed golf."
    match: {any: [{facet: "kind", in: ["golf-course"]}, {facet: "activity.type", in: ["golf"]}]}
    cite: "maid-of-honor-hq/scripts/check-no-golf.ts:3@1bcdb7a"
    quote: "golf is a bachelor/corporate lever — never MOH."
    cite_2: "maid-of-honor-hq/src/data/index.ts:86-91@1bcdb7a"
    quote_2: "    (a) => (a as { type?: string }).type !== \"golf\","
    applies_to: ["rows"]
  - id: "moh-intl"
    text: "Maid of Honor HQ is US-only: rows in an international destination, and non-US golf courses."
    match: {facet: "place.scope", in: ["non-us"]}
    cite: "maid-of-honor-hq/src/data/index.ts:25-27@1bcdb7a"
    quote: "  .filter((d) => d.region !== \"international\");"
    applies_to: ["rows"]
  - id: "moh-activity-types"
    text: "An activity whose type is not in MOH_ACTIVITY_TYPES never reaches MOH (applyMohOverlay's type filter)."
    match: {facet: "activity.type", not_in: ["adventure-park", "art-class", "atv", "axe-throwing", "beach", "beach-hangout", "biking", "boat-cruise", "boudoir", "brewery-tour", "brunch-crawl", "burlesque-class", "cacao-ceremony", "candle-making", "canyoneering", "casino", "cigar-bar", "cocktail-class", "cooking-class", "dance-class", "distillery-tour", "dog-sledding", "drag-brunch", "escape-room", "farm-tour", "fishing", "flower-crown", "food-tour", "ghost-tour", "go-karts", "hiking", "horseback-riding", "karaoke", "kayaking", "luxe-picnic", "matcha-ceremony", "mid-century-tour", "mural-tour", "paintball", "painting-class", "perfume-making", "photoshoot", "pickleball", "poker-night", "pole-class", "pool-party", "pottery-class", "racing", "rafting", "rooftop-bar", "scenic-overlook", "shooting-range", "shopping-tour", "silent-disco", "skiing", "skydiving", "sleigh-ride", "snorkeling", "sound-bath", "spa", "spa-day", "sports-event", "stargazing", "sunset-cruise", "tarot-reading", "tea-ceremony", "tennis-clinic", "tour", "vortex-hike", "walking-tour", "wine-tour", "yacht-charter", "yoga-retreat", "zip-lining"]}
    cite: "shared-data/src/destinations-overlay.ts:38@dde2cb7"
    quote: "export const MOH_ACTIVITY_TYPES = new Set(["
    cite_2: "shared-data/src/destinations-overlay.ts:107@dde2cb7"
    quote_2: ".filter((a) => MOH_ACTIVITY_TYPES.has(a.type))"
    cite_3: "maid-of-honor-hq/src/data/index.ts:26@1bcdb7a"
    quote_3: ".map((d) => applyMohOverlay(d) as PartyDestination)"
    applies_to: ["rows"]
not_rules:
  - id: "moh-picker-international"
    why: "not a facts row: filters the wizard's city-picker stubs; the rows themselves are covered by moh-intl"
    what: "Wizard city picker (CITIES) drops destination stubs with region 'international', and also drops any stub whose state has no region mapping (regionForDestination returns null)."
    cite: "maid-of-honor-hq/src/data/regions.ts:197-204@1bcdb7a"
    quote: "  .filter((d) => d.region !== \"international\")"
  - id: "moh-feral-excluded-slugs"
    why: "not a facts row: filters authored atlas trips, and the set is empty"
    what: "Atlas feral trips (extend2 batch) whose slug is in EXCLUDED_SLUGS are dropped; the set is currently empty, so nothing is dropped at this sha."
    cite: "maid-of-honor-hq/src/data/feral-trips-extend2.ts:24-28@1bcdb7a"
    quote: "const EXCLUDED_SLUGS = new Set<string>([]);"
  - id: "moh-state-allowlist"
    why: "conditional: depends on user input or page"
    what: "Destination candidates outside the user's chosen states are dropped (no-op when states is empty)."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:258-263@1bcdb7a"
    quote: "    ? candidates.filter((d) => stateAllowList.includes(d.state.toUpperCase()))"
  - id: "moh-budget-lodging-filter"
    why: "conditional: depends on user input or page"
    what: "Destination dropped when cheapest lodging per person x (nights) exceeds 60% of the budget ceiling (ceilings: under-500=500, 500-1000=1000, 1000-1500=1500, 1500-2000=2000, 2000-plus/no-limit=99999, i.e. no filter)."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:275-278@1bcdb7a"
    quote: "        if (maxBudget < 99999 && estimatedLodgingTotal > maxBudget * 0.6) {"
  - id: "moh-intensity-chill-disqualify"
    why: "conditional: depends on user input or page"
    what: "When activityIntensity is 'chill', these destination ids are dropped."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:241@1bcdb7a"
    quote: "  const chillDisqualify = new Set([\"miami-fl\", \"las-vegas-nv\"]);"
  - id: "moh-intensity-unhinged-disqualify"
    why: "conditional: depends on user input or page"
    what: "When activityIntensity is 'unhinged', these destination ids are dropped."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:242-249@1bcdb7a"
    quote: "  const unhingedDisqualify = new Set<string>(["
soft_fit:
  - id: "moh-rental-house-default"
    text: "Prompt philosophy: one big rental house beats a hotel (exception Vegas/Miami)."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:1111@1bcdb7a"
    quote: "- One big rental house is ALWAYS better than a hotel — it's HQ, the hangout, the home base (exception: Vegas/Miami where hotel = pool/club access)"
  - id: "moh-nothing-before-10"
    text: "Prompt: nothing scheduled before 10 AM."
    cite: "maid-of-honor-hq/src/lib/party-planner-prompt.ts:1118@1bcdb7a"
    quote: "- Nothing before 10 AM — hangovers are real"
  - id: "moh-age-floor-21"
    text: "Accepted age ranges start at 21."
    cite: "maid-of-honor-hq/src/lib/validate.ts:16@1bcdb7a"
    quote: "const AGE_RANGES = [\"21-25\", \"25-30\", \"30-35\", \"35-40\", \"40+\", \"Mixed\", \"\"] as const;"
image_rules:
  - id: "moh-image-cross-brand"
    text: "Local shared image cache: any entry whose normalized query matches CROSS_BRAND is never served (exact and loose matches). Regex source (no flags): \\b(bachelor|bachelors|groom|grooms|stag|golf|golfing)\\b"
    cite: "maid-of-honor-hq/src/lib/image-service.ts:108@1bcdb7a"
    quote: "const CROSS_BRAND = /\\b(bachelor|bachelors|groom|grooms|stag|golf|golfing)\\b/;"
  - id: "moh-image-cross-brand-applied"
    text: "CROSS_BRAND is tested on the exact-match entry and skips every loose-match entry."
    cite: "maid-of-honor-hq/src/lib/image-service.ts:155-166@1bcdb7a"
    quote: "    if (CROSS_BRAND.test(cached)) continue;"
  - id: "moh-no-crown-tiara-flute-marks"
    text: "Anti-cliché: no crown / tiara / champagne-flute ICONS used as standalone marks (design-icon rule; BRAND.md says nothing about photo subjects here)."
    cite: "maid-of-honor-hq/BRAND.md:219@1bcdb7a"
    quote: "- Crown / tiara / champagne-flute icons used as standalone marks"
  - id: "moh-photography-light-source"
    text: "Hero sections use full-bleed photography; homepage hero photo runs through the #moh-duotone filter."
    cite: "maid-of-honor-hq/BRAND.md:207-210@1bcdb7a"
    quote: "7. **Photography is the light source** — hero sections use full-bleed"
  - id: "moh-palette-rejects"
    text: "Rejected visual motifs: hot pink, rose gold, glitter, pastel rainbows."
    cite: "maid-of-honor-hq/BRAND.md:220@1bcdb7a"
    quote: "- Hot pink, rose gold, glitter, pastel rainbows"
absent:
  - what: "Any venue/activity NAME denylist"
    command: "git -C ~/maid-of-honor-hq grep -n -iE \"denyName|NAME_DENY|BLOCKED_NAMES|nameDeny|BANNED_VENUE|venueDeny\" origin/main -- src scripts"
    hits: 0
  - what: "Crown/tiara/flute check in image selection code"
    command: "git -C ~/maid-of-honor-hq grep -n -iE \"tiara|crown|flute\" origin/main -- src/lib/image-service.ts"
    hits: 0
  - what: "BRAND.md banned words 'babe' / 'bride tribe' in any deterministic gate or scrubber"
    command: "git -C ~/maid-of-honor-hq grep -n -iE \"\\bbabe\\b|bride tribe\" origin/main -- scripts/check-brand-drift.ts src/lib/scrub-voice.ts"
    hits: 0
notes: ["BRAND.md voice uses 'her crew' as its register example (BRAND.md:94-95@1bcdb7a, quote: '(\"her\", \"she\", \"her crew\").') while BRAND.md:107 bans `crew`, check-brand-drift.ts:27 fails on it, and scrub-voice.ts:55 rewrites it. BRAND.md is allow-listed in the drift gate (check-brand-drift.ts:82: '\"BRAND.md\",').", "Three different banned-word lists: BRAND.md:107-108 (crew, squad, send-it, babe, bride tribe + 4 clichés); check-brand-drift.ts:26-47 (adds send-off, the guys, the boys, no survivors, best man, bestman, groomsm[ae]n, engagedmoon, proposalmoon; lacks squad, babe, bride tribe, clichés); party-planner-prompt.ts:1101-1103 (adds legend, bachelor, groom, golf closing metaphors); generate-feral-extend.ts:193 adds unhinged, last ride, rage, getting rowdy, wild night out, party hard, full send.", "Wizard intensity value 'unhinged' is used in code (party-planner-prompt.ts:283@1bcdb7a, quote: 'if (state.activityIntensity === \"unhinged\" && unhingedDisqualify.has(dest.id)) return false;') while generate-feral-extend.ts:193 bans 'unhinged' as BMHQ's word.", "US-only vs international atlas: generate-feral-extend.ts:198 'Every trip is US-only (50 states). Never suggest international.' but feral-trips-extend.ts:3991@1bcdb7a ships 'title: \"Reykjavik Blue Lagoon + Sky Lagoon Geothermal Weekend — Reykjavik, IS\",' and PartyWizardClient.tsx:2746 advertises 'named-operator weekends abroad (Esalen, Reykjavik, Mykonos, Patagonia, San Juan Islands, more)'. atlas-rotation-pool.ts:11 lists '8 international apex (Reykjavik, Marrakech, Lake Como, Patagonia)'.", "PartyWizardClient.tsx:319-323 says International is NOT offered as a region (dead-but-defensive), yet lines 2714-2746 still render an International handoff card.", "The international filter at index.ts:27 applies only to sharedAsMoh; mohLocals() rows (index.ts:103 '...(mohLocals() as unknown as PartyDestination[]),') are merged without a region check. The picker filter regions.ts:198 covers the wizard pool only.", "Golf is stripped from rows (index.ts:86-91) but still modeled/weighted: types.ts:71 keeps '| \"golf\"' in ActivityType; theme-selector.ts:122 weights '\"golf\": 8'; generate-feral-extend.ts:39 ACTIVITY_TYPES includes \"golf\"; brideType 'golfer' persists (plan-types.ts:35).", "check-no-golf.ts header (lines 5-9) says it guards the path shared-data verify-universe does not cover; it asserts the end state only on activity.type — a golf venue carried under any other activity.type is not matched by either stripGolf or the gate (no name match exists).", "index.ts:10-11 comment still describes 'per-repo destinations-*.ts files', but the locals now come from shared-data's mohLocals() (index.ts:6, 103)."]

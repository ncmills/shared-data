# profiles/bestman.yaml — CORPUS-M4 site profile (tagger input). Every rule cites <repo>/<file>:<line>@<sha>;
# anything the repo does not state is ABSENT. hard_excludes → suitability/bestman.json eligible "no" (rules@<blob sha of this file>).
# not_rules = deterministic filters found in the site that are NOT row rules here, with the reason. Read by scripts/corpus/suitability.ts.
site: "bestman"
repo: "plan-my-party"
ref: "ec46b76"
shared_data_ref: "dde2cb7"
vocab: "1.0.0"
brand_source:
  cite: "plan-my-party/BRAND.md@ec46b76"
voice:
  summary: "Garden & Gun / Field Mag / Yeti Presents canon (ruling 2026-09-24): sporting/field-story telling — place, operator, season, gear, the man it is for. Warm, confident, restrained; specific named nouns over bluster; a guys' trip, not a frat party; no MOH-coded voice. Allowed register: \"Lock it in.\" \"Cheat code.\" \"Sent.\" \"Send him off right.\" Crew, brothers, groomsmen."
  cite: "plan-my-party/BRAND.md:115-127@ec46b76"
  quote: "**Garden & Gun / Field Mag / Yeti Presents.** The canon voice for Best Man HQ"
  banned_words: ["world-class", "premium", "trusted", "cutting-edge", "king (as noun/honorific)", "goat (as noun/honorific)", "legend (as noun/honorific)", "flame emoji 🔥", "dollar-sign imagery", "gold-chain references", "MOH bachelorette voice (\"her\", \"she\", \"the bride\")", "crown emoji 👑 in UI"]
  cite_banned: "plan-my-party/BRAND.md:134-140@ec46b76"
  quote_banned: "- `world-class`, `premium`, `trusted`, `cutting-edge`"
  extra_banned_in_prompt:
    text: "The generation prompt additionally bans bachelorette-coded words in every output field: \"bridesmaid\", \"bride\", \"elevated\" (as dining/venue descriptor), \"linen\", \"quiet luxury\"; and adds \"girls' trip\" to the MOH-voice ban. Not in BRAND.md."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:1309@ec46b76"
    quote: "This is a BACHELOR party plan. The following bachelorette-coded words are BANNED in every output field"
  deterministic_scrub:
    text: "Only premium/world-class/trusted/cutting-edge are deterministically rewritten post-generation (premium->top-shelf, world-class->unreal, trusted->go-to, cutting-edge->next-level). king/legend/goat are NOT scrubbed (prompt-only). Scrub rewrites every string value except keys priceLevel,id,slug,url,image,imageSearch,imageUrl,address — venue names included."
    cite: "plan-my-party/src/lib/scrub-voice.ts:25-35@ec46b76"
    quote: "  [/\\bpremium\\b/gi, \"top-shelf\"],"
audience:
  summary: "The groom's crew planning a bachelor party (\"guys trip\"); the organizer is the best man. Bachelor only — showcase and atlas retrieval are keyed to the bachelor occasion/audience."
  cite: "plan-my-party/BRAND.md:123-124@ec46b76"
  quote: "- **A guys' trip, not a frat party.** No strip-club tropes, no \"we're gonna"
group_size:
  min: 2
  max: 30
  cite: "plan-my-party/src/lib/validate.ts:153@ec46b76"
  quote: "  const groupSize = clampInt(s.groupSize, 2, 30, 12);"
  note: "Wizard stepper enforces the same 2..30 bounds (PartyWizardClient.tsx:2015 and :2028); default 12. Auto-pick seeds 6–18 (PartyWizardClient.tsx:424)."
product:
  summary: "AI bachelor-party trip planner: wizard -> 1–3 destination/tier plans (tier names \"Weekend Warrior\", \"The Legend\", \"The King\") grounded in the destination catalog (nightlife, dining, activities, lodging, transport, golf courses)."
  cite: "plan-my-party/src/lib/party-planner-prompt.ts:1256@ec46b76"
  quote: "You are the BESTMAN HQ AI Trip Planner — an expert bachelor party architect who has planned hundreds of weekends across America."
geography:
  summary: "US wizard regions (7) plus International. 21 international catalog destinations are fully plannable and in the picker; region filter joins on destination.state (country for international). One-click \"Plan it all for me\" auto-pick is domestic-only. Surprise mode has no region filter (international can surface)."
  allow: ["Southwest", "Pacific NW", "Mountain West", "South Central", "Southeast", "Midwest", "Northeast", "International"]
  cite: "plan-my-party/src/components/PartyWizardClient.tsx:255-270@ec46b76"
  quote: "  { id: \"International\", label: \"International\" },"
  cite_regions: "plan-my-party/src/data/regions.ts:69-77@ec46b76"
  quote_regions: "export const REGION_DEFINITIONS: Record<Exclude<WizardRegion, \"International\">, string[]> = {"
content_rules:
  - id: "bestman-guys-trip-not-frat"
    text: "A guys' trip, not a frat party: no strip-club tropes, no \"we're gonna rage\" copy."
    cite: "plan-my-party/BRAND.md:123-124@ec46b76"
    quote: "- **A guys' trip, not a frat party.** No strip-club tropes, no \"we're gonna"
  - id: "bestman-named-operators"
    text: "Specific nouns beat bluster: name the guide, river, steakhouse, hour the boat leaves; never \"a fun bar\"."
    cite: "plan-my-party/BRAND.md:121-122@ec46b76"
    quote: "- **Specific nouns beat bluster.** Name the guide, the river, the steakhouse,"
  - id: "bestman-voices-never-cross"
    text: "Nothing MOH-coded appears here; this voice does not go to MOH."
    cite: "plan-my-party/BRAND.md:125-127@ec46b76"
    quote: "- **Voices never cross.** Nothing MOH-coded appears here, and this voice does"
  - id: "bestman-mixed-generations"
    text: "When mixedGenerations is set (dad/father-in-law/uncles attending): tone down club/strip-club language, tilt to steakhouses/whiskey bars/cigar lounges, nightlife MUST end by midnight, NO adult entertainment venues. Prompt-level only, except the midnight part which has a deterministic backstop (see bestman-curfew-mixed-generations)."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:2143@ec46b76"
    quote: "Nightlife MUST end by midnight — do NOT schedule any venue, activity, or transport pickup/drop-off past 12:00 AM. Do NOT include any adult entertainment venues."
  - id: "bestman-no-invented-venues"
    text: "Never invent a venue, restaurant, or activity provider."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:1617@ec46b76"
    quote: "Never invent a venue, restaurant, or activity provider."
  - id: "bestman-no-fabricated-ratings"
    text: "Do not emit googleRating/reviewCount unless the database record has them."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:1626@ec46b76"
    quote: "- Do NOT invent social-proof numbers. If the database record has no rating, do not emit \\`googleRating\\` or \\`reviewCount\\`."
  - id: "bestman-day-activity-window"
    text: "Day activities 10:00 AM–4:00 PM (never before 10:00)."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:1500@ec46b76"
    quote: "- Day activities: 10:00 AM–4:00 PM (never before 10:00 due to hangovers)"
  - id: "bestman-venue-radius"
    text: "Venues within 30–45 min of lodging, never more than 1 hour."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:1502@ec46b76"
    quote: "- Venues must be within 30–45 min of lodging (NEVER more than 1 hour)"
  - id: "bestman-user-excludes-forbidden"
    text: "Negations parsed from specialRequests are injected into the prompt as a FORBIDDEN list (and backstopped deterministically, see bestman-user-exclude-tokens)."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:2094@ec46b76"
    quote: "    ? `\\n\\nFORBIDDEN (DO NOT INCLUDE — parsed from special requests as negations): ${excludeList.join(\", \")}"
hard_excludes:
  - id: "bestman-activity-types"
    text: "An activity whose type is not in BESTMAN_ACTIVITY_TYPES never reaches Best Man HQ (applyBestmanOverlay's type filter)."
    match: {facet: "activity.type", not_in: ["adventure-park", "atv", "axe-throwing", "beach", "beach-hangout", "biking", "boat-cruise", "brewery-tour", "brunch-crawl", "canyoneering", "casino", "cigar-bar", "cocktail-class", "cooking-class", "distillery-tour", "dog-sledding", "escape-room", "farm-tour", "fishing", "food-tour", "go-karts", "golf", "hiking", "horseback-riding", "karaoke", "kayaking", "luxe-picnic", "mural-tour", "paintball", "photoshoot", "poker-night", "pool-party", "racing", "rafting", "rooftop-bar", "scenic-overlook", "second-line-parade", "shooting-range", "skiing", "skydiving", "sleigh-ride", "snorkeling", "spa", "sports-event", "sunset-cruise", "tour", "walking-tour", "wine-tour", "zip-lining"]}
    cite: "shared-data/src/destinations-overlay.ts:53@dde2cb7"
    quote: "export const BESTMAN_ACTIVITY_TYPES = new Set(["
    cite_2: "shared-data/src/destinations-overlay.ts:135@dde2cb7"
    quote_2: ".filter((a) => BESTMAN_ACTIVITY_TYPES.has(a.type))"
    cite_3: "plan-my-party/src/data/index.ts:12@ec46b76"
    quote_3: "const sharedAsBestman = sharedDestinations.map((d) => applyBestmanOverlay(d) as PartyDestination);"
    applies_to: ["rows"]
not_rules:
  - id: "bestman-nightlife-bachelorfriendly"
    why: "tag-keyed: bachelorFriendly is set by applyBestmanOverlay for rows whose wizards include bestman — the legacy tag this layer replaces (see G-diff)"
    what: "Nightlife venues whose bachelorFriendly flag is falsy are dropped from the destination context sent to the planner (never offered to the LLM)."
    cite: "plan-my-party/src/data/query.ts:158-159@ec46b76"
    quote: "    .filter((v) => v.bachelorFriendly)"
  - id: "bestman-golf-routing-gate"
    why: "tag-keyed: gated on shared-data golf routing (wizards) — the legacy tag this layer replaces"
    what: "ALL golf courses are dropped from context unless shared-data golf routing lists \"bestman\" in core.wizards or in any expand[].wizards (module-load constant; no user input)."
    cite: "plan-my-party/src/data/query.ts:27-30@ec46b76"
    quote: "  GOLF_ROUTING.core.wizards.includes(\"bestman\") ||"
  - id: "bestman-golf-top3-cap"
    why: "a cap, not eligibility: which 3 courses reach the prompt depends on the city"
    what: "Only the first 3 courses returned by coursesForCity(city, state) reach the prompt; courses beyond index 2 are dropped."
    cite: "plan-my-party/src/data/query.ts:200-202@ec46b76"
    quote: "    ? coursesForCity(dest.city, dest.state).slice(0, MAX_GOLF_COURSES)"
  - id: "bestman-showcase-occasion"
    why: "not a facts row: filters authored showcase itineraries"
    what: "Showcase itineraries whose occasion is not \"bachelor\" are dropped from the showcase index."
    cite: "plan-my-party/src/data/showcase-index.ts:82@ec46b76"
    quote: "    .filter((s) => s.occasion === \"bachelor\")"
  - id: "bestman-lodging-budget-cap"
    why: "conditional: depends on user input or page"
    what: "Destination dropped when its cheapest lodging (per-room price, or per-property / max(groupSize,2)) x (numberOfDays-1) exceeds 60% of the budget cap. Region/surprise modes only; skipped for \"no-limit\"; and the broaden-pool fallback (party-planner-prompt.ts:1195-1207) can re-add dropped cities with score 0 when fewer than n survive."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:485-489@ec46b76"
    quote: "        if (!isUnlimitedBudget && estimatedLodgingTotal > maxBudget * 0.6) {"
  - id: "bestman-chill-disqualify"
    why: "conditional: depends on user input or page"
    what: "Chill-intensity trips drop three party cities by id (region/surprise modes; fallback can re-add)."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:472@ec46b76"
    quote: "  const chillDisqualify = new Set([\"las-vegas-nv\", \"miami-fl\", \"atlantic-city-nj\"]);"
  - id: "bestman-unhinged-disqualify"
    why: "conditional: depends on user input or page"
    what: "Intended to drop three sleepy towns for high-intensity trips, but it tests activityIntensity === \"send-it\", which validate.ts normalizes to \"unhinged\" before this runs — so via the validated API path it never fires (effectively dead)."
    cite: "plan-my-party/src/lib/party-planner-prompt.ts:473@ec46b76"
    quote: "  const unhingedDisqualify = new Set([\"sedona-az\", \"asheville-nc\", \"savannah-ga\"]);"
  - id: "bestman-vibe-filter"
    why: "conditional: depends on user input or page"
    what: "Candidate destinations must include the trip vibe (chill|unhinged|balanced, mapped from activityIntensity). Region/surprise pool only; specific-city resolution falls back to the full catalog; broaden-pool layer 1 drops the vibe filter when fewer than n cities survive."
    cite: "plan-my-party/src/data/query.ts:80-82@ec46b76"
    quote: "    results = results.filter((d) => d.vibes.includes(query.vibe!));"
  - id: "bestman-region-state-filter"
    why: "conditional: depends on user input or page"
    what: "Region mode keeps only destinations whose state is in the chosen region's state set, and further in the user's chosen state chips if any."
    cite: "plan-my-party/src/data/query.ts:65-68@ec46b76"
    quote: "    return results.filter((d) => allow.has(d.state.toUpperCase()));"
  - id: "bestman-autopick-domestic"
    why: "conditional: depends on user input or page"
    what: "The one-click \"Plan it all for me\" auto-pick excludes International cities from its random city choice."
    cite: "plan-my-party/src/components/PartyWizardClient.tsx:417@ec46b76"
    quote: "  const city = pickOne(CITIES.filter((c) => c.region !== \"International\"));"
  - id: "bestman-user-exclude-tokens"
    why: "conditional: depends on user input or page"
    what: "Post-generation backstop: plan activities (name), dining (name,type; swapped for a clean diningAlternative if any), bars (name,vibe), and schedule items (activity,detail) matching a user negation token are removed. Tokens come from specialRequests; \"shellfish\"/\"pork\" expand to synonym lists."
    cite: "plan-my-party/src/app/api/generate-plan/route.ts:1050-1052@ec46b76"
    quote: "    (t) => new RegExp(`(?:^|[^a-z0-9])${escape(t)}(?:[^a-z0-9]|$)`, \"i\")"
  - id: "bestman-curfew-mixed-generations"
    why: "conditional: depends on user input or page"
    what: "When mixedGenerations is set, schedule items starting 12:01 AM–4:59 AM are dropped (12:00 AM allowed). Operates on plan schedule items, not catalog rows."
    cite: "plan-my-party/src/lib/curfew-guard.ts:36-42@ec46b76"
    quote: "      day.items = day.items.filter((it) => !isPastMidnight(it?.time));"
soft_fit:

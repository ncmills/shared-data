    text: "Illustrations + typography do the emotional work, not stock photography. Remaining Unsplash photos must carry a >=0.55 multiply overlay so they read as engraved prints."
    cite: "plan-my-party/BRAND.md:283@ec46b76"
    quote: "7. **Illustrations + typography do emotional work now — not stock photography.** Existing Unsplash photos that remain on the site must have a ≥ 0.55 multiply overlay"
  - id: "bestman-no-stock-team-photos"
    text: "Anti-cliché: no stock \"diverse team high-fiving\" photography; no dollar-sign imagery, crown emoji, gold chains."
    cite: "plan-my-party/BRAND.md:291-299@ec46b76"
    quote: "- Stock \"diverse team high-fiving\" photography"
  - id: "bestman-commissioned-line-illustration"
    text: "Direction is commissioned line illustrations instead of stock photos (brand shift 2026-04-19)."
    cite: "plan-my-party/BRAND.md:9-10@ec46b76"
    quote: "positioning. New direction is **varsity-letterman editorial** — commissioned"
absent:
  - what: "Minimum-age / 21+ / drinking-age rule"
    command: "git -C ~/plan-my-party grep -n -i -E \"21\\+|drinking age|under ?21\" origin/main -- src/lib src/data BRAND.md ':!src/data/unhinged-*' ':!src/data/showcase-generated.ts'"
    hits: 0
  - what: "Deterministic (code) filter dropping adult-entertainment / strip-club venues — the mixed-generations ban is prompt-only"
    command: "git -C ~/plan-my-party grep -n -i -E \"adult entertainment|strip.?club\" origin/main -- src/data/query.ts src/lib/curfew-guard.ts src/lib/exclusion-synonyms.ts src/lib/scrub-voice.ts"
    hits: 0
  - what: "Country denylist / blocked-country rule for international destinations"
    command: "git -C ~/plan-my-party grep -n -i -E \"(country|countries).{0,40}(exclude|deny|block|banned)\" origin/main -- src/data src/lib ':!src/data/unhinged-*' ':!src/data/showcase-generated.ts'"
    hits: 0
  - what: "Hard drop of activities by groupMin/groupMax in query or generate-plan route (group size is scoring-only)"
    command: "git -C ~/plan-my-party grep -n -i -E \"groupMin\\s*>|groupMax\\s*<\" origin/main -- src/data/query.ts src/app/api/generate-plan/route.ts"
    hits: 0
  - what: "Image licensing / hotlink / alt-text rules in BRAND.md"
    command: "git -C ~/plan-my-party grep -n -i -E \"hotlink|image.*licen|alt text|alt=\" origin/main -- BRAND.md"
    hits: 0
notes: ["BRAND.md bans \"king\"/\"legend\" as honorifics (BRAND.md:137) but the product tier names are \"The Legend\" and \"The King\"; the prompt carves out an explicit exception (party-planner-prompt.ts:1316) that BRAND.md does not contain.", "BRAND.md bans \"premium\" (BRAND.md:136) yet the prompt itself instructs \"Premium everything\" for 40+ (party-planner-prompt.ts:1406 and :1910), and \"Comfort is king\" (same lines). Output is scrubbed for \"premium\" (scrub-voice.ts:27) but not for \"king\".", "BRAND.md anti-clichés ban \"king/goat/flame\" copy and the flame emoji (BRAND.md:138, :291), while BRAND.md:231 specifies CelebrationBurst as a deliberate \"ember/flame\" burst — \"Flames, not confetti\".", "CLAUDE.md:8 says the 2026-04-16 evolution moved to \"amber-on-pure-black\"; BRAND.md:5-6 says the brand moved AWAY from amber-on-pure-black to bourbon-on-ink, and BRAND.md:290 lists amber-on-pure-black as an anti-cliché.", "BRAND.md:9 itself uses \"premium positioning\" (internal rationale prose) while banning \"premium\" (BRAND.md:136).", "Dead filter: unhingedDisqualify is gated on activityIntensity === \"send-it\" (party-planner-prompt.ts:494) but validate.ts:174-177 rewrites \"send-it\" to \"unhinged\" first, so the three-city drop never fires on the validated path.", "System prompt says the planner has planned weekends \"across America\" (party-planner-prompt.ts:1256), while regions.ts:17-38 and PartyWizardClient.tsx:263-269 state 21 international destinations are fully plannable.", "Auto-pick is domestic-only (PartyWizardClient.tsx:414-417) but surprise-me mode applies no region filter (party-planner-prompt.ts:400-401, 462), so a surprise plan can land internationally.", "Hard budget and chill filters are softened by the broaden-pool fallback (party-planner-prompt.ts:1164-1207), which re-queries without those filters and can re-add dropped cities with score 0.", "The venue-level brand filter (applyBestmanOverlay) lives in the shared-data package; this repo only states it exists (index.ts:44-45, union-merge.ts:155-156). Its terms must be profiled from shared-data, not here."]
